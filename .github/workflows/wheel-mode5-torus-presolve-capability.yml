name: Wheel mode5 torus pre-solve capability

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - tools/wheel-mode5-torus-presolve-capability.mjs
      - .github/workflows/wheel-mode5-torus-presolve-capability.yml

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: node tools/wheel-mode5-torus-presolve-capability.mjs
