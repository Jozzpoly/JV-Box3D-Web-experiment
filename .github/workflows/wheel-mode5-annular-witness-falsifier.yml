name: Wheel mode5 annular witness falsifier

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - tools/owner-vehicle/owner-m6-tire-geometry-r3.mjs
      - tools/wheel-mode5-annular-witness-falsifier.mjs
      - .github/workflows/wheel-mode5-annular-witness-falsifier.yml

permissions:
  contents: read

jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JV_WITNESS_SCOPE: selected
      JV_WITNESS_COARSE_STEPS: 96
      JV_WITNESS_REFINE_STEPS: 13
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Compile and stage runtime
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.test.json
          mkdir -p .test-dist/physics/vendor
          cp src/physics/vendor/box3d-mode5.inline.mjs .test-dist/physics/vendor/box3d-mode5.inline.mjs
      - name: Compare raw C, annular witness predicate, and exact visual Tire onset
        run: node tools/wheel-mode5-annular-witness-falsifier.mjs
