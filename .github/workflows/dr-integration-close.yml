name: JV D-R Integration Close

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - .github/workflows/dr-integration-close.yml

permissions:
  contents: read
  statuses: write

jobs:
  close:
    runs-on: windows-latest
    env:
      CANDIDATE_SHA: bd8980eba3e62b5a4b48df528be2db275addf7b4
    steps:
      - name: Record pending
        shell: pwsh
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/$env:CANDIDATE_SHA" -f state=pending -f context=jv/dr-integration-close -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact clean checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw "Wrong checkout" }
          if (git status --porcelain) { throw "Dirty checkout" }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - name: Install declared npm
        run: npm install --global npm@11.13.0
      - name: Install dependencies
        run: npm ci
      - name: Run full repository build
        run: npm run build
      - name: Record success
        if: success()
        shell: pwsh
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/$env:CANDIDATE_SHA" -f state=success -f context=jv/dr-integration-close -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record failure
        if: failure()
        shell: pwsh
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/$env:CANDIDATE_SHA" -f state=failure -f context=jv/dr-integration-close -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
