name: Wheel mode5 RH0 legacy-composition bridge replay

on:
  push:
    branches:
      - work/wheel-mode5-e2a-outer-ground-dynamic-2026-09-03
    paths:
      - tools/wheel-mode5-rh0-legacy-composition-replay.mjs
      - tools/wheel-mode5-rh0-replay-result-validate.mjs
      - docs/evidence/WHEEL_MODE5_RH0_CANONICAL_REPLAY_CONTRACT_2026-09-05.json
      - .github/workflows/wheel-mode5-rh0-legacy-composition-replay.yml

permissions:
  contents: read

jobs:
  bridge-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache

      - run: npm ci

      - name: Recover pinned Box3D.js and donor wheel implementation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/isaac-mason/box3d.js.git box3djs
          git -C box3djs checkout 2617a0ff763a60c9f17cee57c6ea72aab75a5077
          git -C box3djs submodule update --init --recursive
          test "$(git -C box3djs/vendor/box3d rev-parse HEAD)" = "8441b4a06d6d09dcfb0b0f704df4d847d1437b92"

          git clone https://github.com/Jozzpoly/Box3d_FunProject.git native
          git -C native fetch origin recovery/jv-reconstruction
          git -C native diff --binary \
            77a67132ffc4f003e84c6ffe4e72abfbcded4d33 \
            241fe10a9056836332c21d9614471d32d749ce3d \
            -- \
            include/box3d/box3d.h include/box3d/collision.h include/box3d/types.h \
            src/CMakeLists.txt src/contact.c src/mesh_contact.c src/physics_world.c \
            src/shape.c src/shape.h src/wheel_shape.c > B3X-WHEEL-001.patch
          test -s B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply --check ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d diff --check

      - name: Compose frozen legacy RQ bridge in one binding translation unit
        shell: bash
        run: |
          set -euxo pipefail
          node --check tools/wheel-mode5-rh0-legacy-composition-replay.mjs
          node --check tools/wheel-mode5-rh0-replay-result-validate.mjs
          python3 -m py_compile \
            tools/wheel-mode5-e1-patch-bindings.py \
            tools/wheel-mode5-e2a-patch-bindings.py \
            tools/wheel-mode5-rq0-patch-bindings.py \
            tools/wheel-mode5-rq0-planar-axle-patch.py \
            tools/wheel-mode5-rq1-patch-bindings.py \
            tools/wheel-mode5-rq1a-patch-hull-introspection.py \
            tools/wheel-mode5-rq1c-patch-first-representable-angle.py \
            tools/wheel-mode5-rq2a-patch-braking.py \
            tools/wheel-mode5-rq2b-patch-drive.py

          JV_E1_ANNULAR_SEGMENTS=128 node tools/wheel-mode5-e1-write-annular-native-header.mjs box3djs/src/e1_annular_profile.h
          python3 tools/wheel-mode5-e1-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a-patch-bindings.py box3djs/src/bindings.cpp

          # Frozen RQ0 canonical helper.
          python3 tools/wheel-mode5-rq0-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq0-planar-axle-patch.py box3djs/src/bindings.cpp

          # Frozen RQ1c canonical helper and read-only hull provenance.
          python3 tools/wheel-mode5-rq1-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq1a-patch-hull-introspection.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq1c-patch-first-representable-angle.py box3djs/src/bindings.cpp

          # Frozen RQ2 longitudinal helpers.
          python3 tools/wheel-mode5-rq2a-patch-braking.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq2b-patch-drive.py box3djs/src/bindings.cpp

          grep -n "rq0RunOuterP75SteadyRolling" box3djs/src/bindings.cpp
          grep -n "rq1RunOuterP75RoadNormalTransition" box3djs/src/bindings.cpp
          grep -n "rq2aRunOuterP75Braking" box3djs/src/bindings.cpp
          grep -n "rq2bRunOuterP75Drive" box3djs/src/bindings.cpp
          grep -n "30.0e-6f" box3djs/src/bindings.cpp
          git -C box3djs diff --check

      - name: Install Box3D.js workspace
        working-directory: box3djs
        run: pnpm install --frozen-lockfile

      - name: Build and validate pinned bridge composition once
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir box3djs build
          pnpm --dir box3djs test

      - name: Execute all frozen canonical RQ bridge scenarios
        run: node tools/wheel-mode5-rh0-legacy-composition-replay.mjs

      - name: Validate bridge replay against frozen RH0 contract
        run: node tools/wheel-mode5-rh0-replay-result-validate.mjs rh0-canonical-rq-replay-result.json

      - name: Preserve bridge replay evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wheel-mode5-rh0-legacy-composition-replay
          path: rh0-canonical-rq-replay-result.json
          if-no-files-found: warn
          retention-days: 30
