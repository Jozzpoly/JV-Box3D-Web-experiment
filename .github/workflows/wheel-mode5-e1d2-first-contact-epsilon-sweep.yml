name: Wheel mode5 E1d2 first-contact epsilon sweep

on:
  push:
    branches:
      - work/wheel-mode5-e1d-recovery-2026-09-03
    paths:
      - tools/wheel-mode5-e1-write-annular-native-header.mjs
      - tools/wheel-mode5-e1-patch-bindings.py
      - tools/wheel-mode5-e1d-patch-bindings.py
      - tools/wheel-mode5-e1d2-first-contact-epsilon-sweep.mjs
      - tools/owner-vehicle/**
      - assets/owner-vehicle/source/Offroad_Big_Wheels.gltf
      - .github/workflows/wheel-mode5-e1d2-first-contact-epsilon-sweep.yml

permissions:
  contents: read

jobs:
  epsilon-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache

      - run: npm ci

      - name: Recover pinned mode5 Box3D.js source and donor wheel patch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/isaac-mason/box3d.js.git box3djs
          git -C box3djs checkout 2617a0ff763a60c9f17cee57c6ea72aab75a5077
          git -C box3djs submodule update --init --recursive
          test "$(git -C box3djs/vendor/box3d rev-parse HEAD)" = "8441b4a06d6d09dcfb0b0f704df4d847d1437b92"

          git clone https://github.com/Jozzpoly/Box3d_FunProject.git native
          git -C native fetch origin recovery/jv-reconstruction
          git -C native diff --binary \
            77a67132ffc4f003e84c6ffe4e72abfbcded4d33 \
            241fe10a9056836332c21d9614471d32d749ce3d \
            -- \
            include/box3d/box3d.h \
            include/box3d/collision.h \
            include/box3d/types.h \
            src/CMakeLists.txt \
            src/contact.c \
            src/mesh_contact.c \
            src/physics_world.c \
            src/shape.c \
            src/shape.h \
            src/wheel_shape.c \
            > B3X-WHEEL-001.patch
          test -s B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply --check ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d diff --check

      - name: Build diagnostic 128-sector native seam with read-only patch introspection
        shell: bash
        run: |
          set -euxo pipefail
          node --check tools/wheel-mode5-e1d2-first-contact-epsilon-sweep.mjs
          python3 -m py_compile tools/wheel-mode5-e1d-patch-bindings.py
          JV_E1_ANNULAR_SEGMENTS=128 node tools/wheel-mode5-e1-write-annular-native-header.mjs box3djs/src/e1_annular_profile.h
          python3 tools/wheel-mode5-e1-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e1d-patch-bindings.py box3djs/src/bindings.cpp
          grep -n "e1ProbeAnnularP75Box\|e1InspectAnnularP75BoxPatch" box3djs/src/bindings.cpp

      - name: Install Box3D.js workspace
        working-directory: box3djs
        run: pnpm install --frozen-lockfile

      - name: Build and smoke test
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir box3djs build
          pnpm --dir box3djs test

      - name: Measure first-contact epsilon sweep
        shell: bash
        run: |
          set -euxo pipefail
          node tools/wheel-mode5-e1d2-first-contact-epsilon-sweep.mjs | tee e1d2.log
          node <<'NODE'
          const fs = require('node:fs');
          const prefix = 'E1D2_EPSILON_SWEEP_RESULT ';
          const line = fs.readFileSync('e1d2.log', 'utf8').split(/\r?\n/).find((row) => row.startsWith(prefix));
          if (!line) throw new Error('E1d2 result marker missing');
          const result = JSON.parse(line.slice(prefix.length));
          const keepInsets = new Set([0, 0.25, 0.5, 1, 2, 5, 10, 50, 100, 500, 1000]);
          const keepReference = new Set([0, 1, 10, 100, 1000]);
          const compactPhase = (phase) => ({
            phaseIndex: phase.phaseIndex,
            onsetDistanceMeters: phase.onsetDistanceMeters,
            onsetBracketWidthNm: phase.onsetBracketWidthNm,
            onsetAcceptedCandidates: phase.onsetAcceptedCandidates,
            rows: phase.rows.filter((row) => keepInsets.has(row.approachInsetUm)).map((row) => ({
              approachInsetUm: row.approachInsetUm,
              rawCandidates: row.rawCandidates,
              acceptedCandidates: row.acceptedCandidates,
              manifoldPointCount: row.manifoldPointCount,
              stationCount: row.stationCount,
              sectorCount: row.sectorCount,
              surfaceCounts: row.surfaceCounts,
              candidateSeparationMm: row.candidateSeparationMm,
              pointCentroid: row.pointCentroid,
              witnessCentroid: row.witnessCentroid,
              normalMean: row.normalMean,
              momentProxy: row.momentProxy,
              winner: row.winner,
            })),
            notableTransitions: phase.transitions.filter((row) =>
              row.candidateCount[0] !== row.candidateCount[1]
              || row.pointCentroidStepMm > 1
              || (row.momentProxyStepMm ?? 0) > 1
              || row.fromInsetUm < 10
            ),
            relativeTo1mm: phase.relativeTo1mm.filter((row) => keepReference.has(row.approachInsetUm)),
          });
          const compact = {
            method: result.method,
            acceptanceSkin: result.acceptanceSkin,
            approachInsetDefinition: result.approachInsetDefinition,
            approachInsetsUm: result.approachInsetsUm,
            provenance: result.provenance,
            ground: result.ground.map(compactPhase),
            sideLow: result.sideLow.map(compactPhase),
          };
          const json = JSON.stringify(compact);
          console.log(`E1D2_COMPACT_RESULT ${json}`);
          console.log(`::notice title=E1D2_COMPACT::${json.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          NODE
