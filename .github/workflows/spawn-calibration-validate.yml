name: JV spawn calibration validation

on:
  push:
    branches:
      - work/spawn-landmark-calibration-2026-09-05
    paths:
      - src/scene/product-spawn.ts
      - tests/product-spawn.test.mjs
      - .github/workflows/spawn-calibration-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source, tests, docs and portable product build
        run: |
          set -euxo pipefail
          test "$(node --version)" = "v24.16.0"
          npm run check
          npm run build:portable
          node tools/validate-build-identity.mjs
          git diff --check
