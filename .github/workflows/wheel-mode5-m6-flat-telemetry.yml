name: Wheel mode5 full M6 flat rolling telemetry

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - tools/wheel-mode5-m6-flat-telemetry.mjs
      - .github/workflows/wheel-mode5-m6-flat-telemetry.yml

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Compare C, rejected D, and torus65 on identical full M6 flat run
        run: |
          set -euo pipefail
          SOURCE=src/vehicle/m6/mode5-wheel-backend.ts
          cp "$SOURCE" "$RUNNER_TEMP/mode5-wheel-backend.original.ts"
          : > "$RUNNER_TEMP/m6-flat-results.jsonl"

          compile_and_run() {
            local label="$1"
            local geometry="$2"
            local ratio="$3"
            cp "$RUNNER_TEMP/mode5-wheel-backend.original.ts" "$SOURCE"
            GEOMETRY="$geometry" RATIO="$ratio" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path('src/vehicle/m6/mode5-wheel-backend.ts')
          text=path.read_text(encoding='utf-8')
          old_select='const requestedGeometry = import.meta.env?.["VITE_JV_MODE5_WHEEL_GEOMETRY"];'
          new_select=f'const requestedGeometry: string | undefined = "{os.environ["GEOMETRY"]}";'
          old_ratio='export const MODE5_CORE_TORUS_CROWN_RATIO = 0.914;'
          new_ratio=f'export const MODE5_CORE_TORUS_CROWN_RATIO = {os.environ["RATIO"]};'
          if text.count(old_select)!=1 or text.count(old_ratio)!=1:
              raise SystemExit('full M6 telemetry source anchors drifted')
          path.write_text(text.replace(old_select,new_select).replace(old_ratio,new_ratio),encoding='utf-8')
          PY
            rm -rf .test-dist
            node node_modules/typescript/bin/tsc -p tsconfig.test.json
            mkdir -p .test-dist/physics/vendor
            cp src/physics/vendor/box3d-mode5.inline.mjs .test-dist/physics/vendor/box3d-mode5.inline.mjs
            JV_TELEMETRY_LABEL="$label" JV_EXPECTED_GEOMETRY="$geometry" \
              node tools/wheel-mode5-m6-flat-telemetry.mjs \
              | tee "$RUNNER_TEMP/$label.log"
            grep '^M6_FLAT_TELEMETRY_RESULT ' "$RUNNER_TEMP/$label.log" \
              | sed 's/^M6_FLAT_TELEMETRY_RESULT //' \
              >> "$RUNNER_TEMP/m6-flat-results.jsonl"
          }

          compile_and_run C solver-aware-profile 0.914
          compile_and_run D914 core-torus64 0.914
          compile_and_run T65 core-torus64 0.65
          cp "$RUNNER_TEMP/mode5-wheel-backend.original.ts" "$SOURCE"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=[json.loads(line) for line in Path(os.environ['RUNNER_TEMP'],'m6-flat-results.jsonl').read_text().splitlines() if line.strip()]
          if [row['label'] for row in rows] != ['C','D914','T65']:
              raise SystemExit(f'unexpected telemetry rows: {[row["label"] for row in rows]}')
          def concise(row):
              settle=row['settle']; drive=row['drive']
              return {
                  'label':row['label'],
                  'geometry':row['compiledGeometry'],
                  'topologyDelta':row['topologyDelta'],
                  'travelMeters':row['travelMetersDuringMeasuredDrive'],
                  'settle':{
                      'chassisYStdMm':settle['chassisY']['stddev']*1000,
                      'chassisYRangeMm':settle['chassisY']['range']*1000,
                      'chassisVyStd':settle['chassisVy']['stddev'],
                      'contactsMean':settle['worldContacts']['mean'],
                      'contactsStd':settle['worldContacts']['stddev'],
                      'contactsRange':settle['worldContacts']['range'],
                      'contactBeginFrames':settle['contactBeginFrames'],
                      'totalContactBegins':settle['totalContactBegins'],
                      'wheelYStdMm':[c['wheelY']['stddev']*1000 for c in settle['corners']],
                      'coiloverStdMm':[c['coiloverLength']['stddev']*1000 for c in settle['corners']],
                  },
                  'drive':{
                      'chassisYStdMm':drive['chassisY']['stddev']*1000,
                      'chassisYRangeMm':drive['chassisY']['range']*1000,
                      'chassisYDeltaP95Mm':drive['chassisY']['deltaAbsP95']*1000,
                      'chassisVyStd':drive['chassisVy']['stddev'],
                      'contactsMean':drive['worldContacts']['mean'],
                      'contactsStd':drive['worldContacts']['stddev'],
                      'contactsRange':drive['worldContacts']['range'],
                      'contactBeginFrames':drive['contactBeginFrames'],
                      'totalContactBegins':drive['totalContactBegins'],
                      'forwardSpeedMean':drive['forwardSpeed']['mean'],
                      'forwardSpeedStd':drive['forwardSpeed']['stddev'],
                      'forwardSpeedDeltaP95':drive['forwardSpeed']['deltaAbsP95'],
                      'forwardSpeedSecondDeltaP95':drive['forwardSpeed']['secondDeltaAbsP95'],
                      'wheelYStdMm':[c['wheelY']['stddev']*1000 for c in drive['corners']],
                      'wheelYDeltaP95Mm':[c['wheelY']['deltaAbsP95']*1000 for c in drive['corners']],
                      'spinDeltaP95':[c['wheelSpinSpeed']['deltaAbsP95'] for c in drive['corners']],
                      'spinSecondDeltaP95':[c['wheelSpinSpeed']['secondDeltaAbsP95'] for c in drive['corners']],
                      'coiloverStdMm':[c['coiloverLength']['stddev']*1000 for c in drive['corners']],
                  },
              }
          summary=[concise(row) for row in rows]
          print('M6_FLAT_TELEMETRY_COMPARISON',json.dumps(summary,separators=(',',':')))
          c,d,t=summary
          ratios={
              'T65_vs_C':{
                  'settleContactsMeanRatio':t['settle']['contactsMean']/c['settle']['contactsMean'] if c['settle']['contactsMean'] else None,
                  'driveContactsMeanRatio':t['drive']['contactsMean']/c['drive']['contactsMean'] if c['drive']['contactsMean'] else None,
                  'driveChassisYStdRatio':t['drive']['chassisYStdMm']/c['drive']['chassisYStdMm'] if c['drive']['chassisYStdMm'] else None,
                  'driveSpeedDeltaP95Ratio':t['drive']['forwardSpeedDeltaP95']/c['drive']['forwardSpeedDeltaP95'] if c['drive']['forwardSpeedDeltaP95'] else None,
              },
              'T65_vs_D914':{
                  'settleContactsMeanRatio':t['settle']['contactsMean']/d['settle']['contactsMean'] if d['settle']['contactsMean'] else None,
                  'driveContactsMeanRatio':t['drive']['contactsMean']/d['drive']['contactsMean'] if d['drive']['contactsMean'] else None,
                  'driveChassisYStdRatio':t['drive']['chassisYStdMm']/d['drive']['chassisYStdMm'] if d['drive']['chassisYStdMm'] else None,
              },
          }
          print('M6_FLAT_TELEMETRY_RATIOS',json.dumps(ratios,separators=(',',':')))
          print('M6_FLAT_TELEMETRY_COMPARISON_OK')
          PY
