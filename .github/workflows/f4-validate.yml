name: f4-validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out F4 source
        uses: actions/checkout@v4

      - name: Use project Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Strict typecheck and full regression suite
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Current M6 browser lifecycle smoke
        run: node tools/smoke-f4-browser.mjs --output /tmp/F4_BROWSER_SMOKE.json
