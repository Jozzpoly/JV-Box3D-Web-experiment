name: Wheel mode5 RQ2C4F rolling-pair closure localization

on:
  push:
    branches:
      - research/wheel-mode5-rq2c-orientation-2026-09-05
    paths:
      - tools/wheel-mode5/rq2c4f/**
      - tools/wheel-mode5/rq2c4e/**
      - tools/wheel-mode5/rq2c4d/**
      - tools/wheel-mode5/rq2c4/**
      - tools/wheel-mode5/rq2c3/**
      - tools/wheel-mode5/rq2c/wheel-mode5-rq2c-orientation-suite.hpp
      - tools/wheel-mode5/rq2c/patch-rq2c-suite-adapter.py
      - tools/wheel-mode5/rh0/**
      - tools/wheel-mode5-e1-write-annular-native-header.mjs
      - tools/wheel-mode5-e1-patch-bindings.py
      - tools/wheel-mode5-e2a-patch-bindings.py
      - docs/evidence/WHEEL_MODE5_RH0_CANONICAL_REPLAY_CONTRACT_2026-09-05.json
      - docs/WHEEL_MODE5_RQ2C4F_ROLLING_PAIR_CLOSURE_LOCALIZATION_DESIGN_2026-09-05.md
      - .github/workflows/wheel-mode5-rq2c4f-rolling-pair-closure.yml

permissions:
  contents: read

jobs:
  closure-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache
      - run: npm ci

      - name: Recover exact RQ2C4 vendor composition
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/isaac-mason/box3d.js.git box3djs
          git -C box3djs checkout 2617a0ff763a60c9f17cee57c6ea72aab75a5077
          git -C box3djs submodule update --init --recursive
          test "$(git -C box3djs/vendor/box3d rev-parse HEAD)" = "8441b4a06d6d09dcfb0b0f704df4d847d1437b92"

          git clone https://github.com/Jozzpoly/Box3d_FunProject.git native
          git -C native fetch origin recovery/jv-reconstruction
          git -C native diff --binary \
            77a67132ffc4f003e84c6ffe4e72abfbcded4d33 \
            241fe10a9056836332c21d9614471d32d749ce3d \
            -- include/box3d/box3d.h include/box3d/collision.h include/box3d/types.h \
               src/CMakeLists.txt src/contact.c src/mesh_contact.c src/physics_world.c \
               src/shape.c src/shape.h src/wheel_shape.c > B3X-WHEEL-001.patch
          test -s B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply --check ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply ../../../B3X-WHEEL-001.patch

          python3 -m py_compile \
            tools/wheel-mode5/rq2c3/patch-rq2c3-parallel-linear-guide.py \
            tools/wheel-mode5/rq2c4/patch-rq2c4-parallel-hard-relax.py
          python3 tools/wheel-mode5/rq2c3/patch-rq2c3-parallel-linear-guide.py box3djs/vendor/box3d
          python3 tools/wheel-mode5/rq2c4/patch-rq2c4-parallel-hard-relax.py box3djs/vendor/box3d
          git -C box3djs/vendor/box3d diff --check

      - name: Compose exact RQ2C4 scenario plus D E F read-only telemetry
        shell: bash
        run: |
          set -euxo pipefail
          node --check tools/wheel-mode5/rq2c4e/wheel-mode5-rq2c4e-angular-localization-run.mjs
          node --check tools/wheel-mode5/rq2c4e/wheel-mode5-rq2c4e-angular-localization-validate.mjs
          node --check tools/wheel-mode5/rq2c4f/wheel-mode5-rq2c4f-rolling-pair-closure-run.mjs
          node --check tools/wheel-mode5/rq2c4f/wheel-mode5-rq2c4f-rolling-pair-closure-validate.mjs
          python3 -m py_compile \
            tools/wheel-mode5-e1-patch-bindings.py tools/wheel-mode5-e2a-patch-bindings.py \
            tools/wheel-mode5/rh0/patch-rq-suite-adapter.py \
            tools/wheel-mode5/rq2c/patch-rq2c-suite-adapter.py \
            tools/wheel-mode5/rq2c3/patch-rq2c3-suite-adapter.py \
            tools/wheel-mode5/rq2c4/patch-rq2c4-suite-adapter.py \
            tools/wheel-mode5/rq2c4d/patch-rq2c4d-slip-instrument.py \
            tools/wheel-mode5/rq2c4e/patch-rq2c4e-angular-contributions.py \
            tools/wheel-mode5/rq2c4f/patch-rq2c4f-rolling-pair-closure.py

          JV_E1_ANNULAR_SEGMENTS=128 node tools/wheel-mode5-e1-write-annular-native-header.mjs box3djs/src/e1_annular_profile.h
          python3 tools/wheel-mode5-e1-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a-patch-bindings.py box3djs/src/bindings.cpp

          cp tools/wheel-mode5/rh0/wheel-mode5-rq-suite.hpp box3djs/src/wheel-mode5-rq-suite.hpp
          cp tools/wheel-mode5/rq2c/wheel-mode5-rq2c-orientation-suite.hpp box3djs/src/wheel-mode5-rq2c-orientation-suite.hpp
          cp tools/wheel-mode5/rq2c3/wheel-mode5-rq2c3-direct-guide-suite.hpp box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp
          cp tools/wheel-mode5/rq2c4/wheel-mode5-rq2c4-hard-relax-suite.hpp box3djs/src/wheel-mode5-rq2c4-hard-relax-suite.hpp

          python3 tools/wheel-mode5/rq2c4d/patch-rq2c4d-slip-instrument.py box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp
          python3 tools/wheel-mode5/rq2c4e/patch-rq2c4e-angular-contributions.py box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp
          python3 tools/wheel-mode5/rq2c4f/patch-rq2c4f-rolling-pair-closure.py box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp
          test "$(grep -Fc 'RQ2C4D_ORIENTATION_AWARE_SLIP_INSTRUMENT' box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp)" = "1"
          test "$(grep -Fc 'RQ2C4E_ANGULAR_CONTRIBUTION_LOCALIZATION' box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp)" = "1"
          test "$(grep -Fc 'RQ2C4F_ROLLING_PAIR_CLOSURE_LOCALIZATION' box3djs/src/wheel-mode5-rq2c3-direct-guide-suite.hpp)" = "1"

          python3 tools/wheel-mode5/rh0/patch-rq-suite-adapter.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5/rq2c/patch-rq2c-suite-adapter.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5/rq2c3/patch-rq2c3-suite-adapter.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5/rq2c4/patch-rq2c4-suite-adapter.py box3djs/src/bindings.cpp
          test "$(grep -Fxc '#include \"wheel-mode5-rq2c4-hard-relax-suite.hpp\"' box3djs/src/bindings.cpp)" = "1"
          test "$(grep -Fc 'function( \"rq2c4RunOuterP75HardRelaxGuide\", &rq2c4RunOuterP75HardRelaxGuide );' box3djs/src/bindings.cpp)" = "1"
          git -C box3djs diff --check

      - name: Install Box3D.js workspace
        working-directory: box3djs
        run: pnpm install --frozen-lockfile

      - name: Build and validate pinned RQ2C4F composition
        run: |
          pnpm --dir box3djs build
          pnpm --dir box3djs test

      - name: Re-run frozen RH0 scenarios before localization
        run: node tools/wheel-mode5/rh0/wheel-mode5-rh0-canonical-rq-replay.mjs

      - name: Require frozen RH0 non-drift before localization
        run: node tools/wheel-mode5-rh0-replay-result-validate.mjs rh0-canonical-rq-replay-result.json

      - name: Re-run unchanged RQ2C4E evidence barriers in F-instrumented composition
        run: node tools/wheel-mode5/rq2c4e/wheel-mode5-rq2c4e-angular-localization-run.mjs rq2c4e-under-rq2c4f-result.json

      - name: Require RQ2C4 primary D witness and E reconstruction non-drift
        run: node tools/wheel-mode5/rq2c4e/wheel-mode5-rq2c4e-angular-localization-validate.mjs rq2c4e-under-rq2c4f-result.json

      - name: Execute RQ2C4F rolling-pair closure localization
        run: node tools/wheel-mode5/rq2c4f/wheel-mode5-rq2c4f-rolling-pair-closure-run.mjs rq2c4f-rolling-pair-closure-result.json

      - name: Require exact closure decomposition before interpretation
        run: node tools/wheel-mode5/rq2c4f/wheel-mode5-rq2c4f-rolling-pair-closure-validate.mjs rq2c4f-rolling-pair-closure-result.json

      - name: Preserve RQ2C4F evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wheel-mode5-rq2c4f-rolling-pair-closure-evidence
          path: |
            rh0-canonical-rq-replay-result.json
            rq2c4e-under-rq2c4f-result.json
            rq2c4f-rolling-pair-closure-result.json
          if-no-files-found: warn
          retention-days: 30
