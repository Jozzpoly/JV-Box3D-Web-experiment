name: Wheel mode5 R3 triangle-gap diagnostic

on:
  push:
    branches:
      - work/wheel-mode5-registration-diagnostic-2026-09-02
    paths:
      - .github/workflows/wheel-mode5-r3-triangle-gap-diagnostic.yml

permissions:
  contents: read

jobs:
  triangle-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Measure exact R3 wheel-mesh distance to worst real-rock case
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const root = 'owner-ab/vehicles/m6-owner-r3';
          const pkg = JSON.parse(await readFile(`${root}/m6-owner-full-rig-r3.visual.json`, 'utf8'));
          const glb = new Uint8Array(await readFile(`${root}/models/m6-owner-full-rig-r3.glb`));
          const view = new DataView(glb.buffer, glb.byteOffset, glb.byteLength);
          if (view.getUint32(0,true)!==0x46546c67) throw new Error('not GLB');
          const jsonLength=view.getUint32(12,true);
          const json=JSON.parse(new TextDecoder().decode(glb.slice(20,20+jsonLength)).trim());
          const binaryHeader=20+jsonLength;
          const binaryLength=view.getUint32(binaryHeader,true);
          const binary=glb.slice(binaryHeader+8,binaryHeader+8+binaryLength);
          const dv=new DataView(binary.buffer,binary.byteOffset,binary.byteLength);

          const binding=pkg.bindings.find(b=>b.bindingId==='owner.fl.wheel');
          if(!binding) throw new Error('missing FL binding');
          const node=json.nodes.find(n=>n.name===binding.nodeName);
          if(!node || node.mesh===undefined) throw new Error(`missing mesh for ${binding.nodeName}`);
          if(node.matrix || node.translation || node.rotation || node.scale) {
            console.log('R3_NODE_TRANSFORM',JSON.stringify({matrix:node.matrix??null,translation:node.translation??null,rotation:node.rotation??null,scale:node.scale??null}));
          }

          function componentReader(componentType) {
            if(componentType===5120) return {bytes:1, read:(o)=>dv.getInt8(o)};
            if(componentType===5121) return {bytes:1, read:(o)=>dv.getUint8(o)};
            if(componentType===5122) return {bytes:2, read:(o)=>dv.getInt16(o,true)};
            if(componentType===5123) return {bytes:2, read:(o)=>dv.getUint16(o,true)};
            if(componentType===5125) return {bytes:4, read:(o)=>dv.getUint32(o,true)};
            if(componentType===5126) return {bytes:4, read:(o)=>dv.getFloat32(o,true)};
            throw new Error(`unsupported component ${componentType}`);
          }
          function typeCount(type){return {SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[type]??(()=>{throw new Error(`type ${type}`)})();}
          function readAccessor(index){
            const a=json.accessors[index];
            const bv=json.bufferViews[a.bufferView];
            const reader=componentReader(a.componentType);
            const n=typeCount(a.type);
            const stride=bv.byteStride??reader.bytes*n;
            const start=(bv.byteOffset??0)+(a.byteOffset??0);
            const out=[];
            for(let i=0;i<a.count;i++){
              const row=[];
              for(let c=0;c<n;c++) row.push(reader.read(start+i*stride+c*reader.bytes));
              out.push(n===1?row[0]:row);
            }
            return out;
          }
          const triangles=[];
          for(const primitive of json.meshes[node.mesh].primitives){
            if(primitive.mode!==undefined && primitive.mode!==4) throw new Error('non-triangle primitive');
            const pos=readAccessor(primitive.attributes.POSITION);
            const idx=primitive.indices!==undefined?readAccessor(primitive.indices):pos.map((_,i)=>i);
            for(let i=0;i<idx.length;i+=3) triangles.push([pos[idx[i]],pos[idx[i+1]],pos[idx[i+2]]]);
          }
          console.log('R3_TRIANGLE_COUNT',triangles.length);

          const qBody={x:Math.SQRT1_2,y:0,z:0,w:Math.SQRT1_2}; // +90 deg X: local Y -> world Z
          function qnorm(q){const l=Math.hypot(q.x,q.y,q.z,q.w);return {x:q.x/l,y:q.y/l,z:q.z/l,w:q.w/l};}
          function qrot(q,v){q=qnorm(q);const {x,y,z,w}=q;const uv=[y*v[2]-z*v[1],z*v[0]-x*v[2],x*v[1]-y*v[0]];const uuv=[y*uv[2]-z*uv[1],z*uv[0]-x*uv[2],x*uv[1]-y*uv[0]];return [v[0]+2*(w*uv[0]+uuv[0]),v[1]+2*(w*uv[1]+uuv[1]),v[2]+2*(w*uv[2]+uuv[2])];}
          function qinv(q){return {x:-q.x,y:-q.y,z:-q.z,w:q.w};}
          const rockQ={x:0.000378,y:0.244667,z:0.000095,w:-0.969607};
          const half=[0.0599166,0.0454778,0.0646366];
          const dir0=[0.144005,-0.240008,0.960031];
          const dl=Math.hypot(...dir0); const dir=dir0.map(v=>v/dl);
          const distance=0.31151123;
          const center=dir.map(v=>v*distance);

          // Transform all R3 triangles from wheel-local into box-local. Box becomes axis-aligned at origin.
          const qi=qinv(rockQ);
          function toBoxLocal(pLocal){
            const world=qrot(qBody,pLocal);
            return qrot(qi,[world[0]-center[0],world[1]-center[1],world[2]-center[2]]);
          }
          const tris=triangles.map(t=>t.map(toBoxLocal));

          function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
          function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
          function mul(a,s){return [a[0]*s,a[1]*s,a[2]*s];}
          function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
          function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
          function len2(a){return dot(a,a);}
          function pointAabbDist2(p){let d2=0;for(let k=0;k<3;k++){const d=Math.max(Math.abs(p[k])-half[k],0);d2+=d*d;}return d2;}
          function axisSeparates(axis,tri){
            const l2=len2(axis); if(l2<1e-18) return false;
            const p=tri.map(v=>dot(v,axis)); const mn=Math.min(...p),mx=Math.max(...p);
            const r=half[0]*Math.abs(axis[0])+half[1]*Math.abs(axis[1])+half[2]*Math.abs(axis[2]);
            return mn>r || mx<-r;
          }
          function triIntersectsBox(tri){
            const e=[sub(tri[1],tri[0]),sub(tri[2],tri[1]),sub(tri[0],tri[2])];
            const axes=[[1,0,0],[0,1,0],[0,0,1],cross(e[0],e[1])];
            for(const edge of e){axes.push(cross(edge,[1,0,0]),cross(edge,[0,1,0]),cross(edge,[0,0,1]));}
            return !axes.some(a=>axisSeparates(a,tri));
          }
          function pointTriDist2(p,a,b,c){
            // Ericson, Real-Time Collision Detection.
            const ab=sub(b,a), ac=sub(c,a), ap=sub(p,a);
            const d1=dot(ab,ap), d2=dot(ac,ap); if(d1<=0&&d2<=0)return len2(ap);
            const bp=sub(p,b), d3=dot(ab,bp), d4=dot(ac,bp); if(d3>=0&&d4<=d3)return len2(bp);
            const vc=d1*d4-d3*d2; if(vc<=0&&d1>=0&&d3<=0){const v=d1/(d1-d3);return len2(sub(p,add(a,mul(ab,v))));}
            const cp=sub(p,c), d5=dot(ab,cp), d6=dot(ac,cp); if(d6>=0&&d5<=d6)return len2(cp);
            const vb=d5*d2-d1*d6; if(vb<=0&&d2>=0&&d6<=0){const w=d2/(d2-d6);return len2(sub(p,add(a,mul(ac,w))));}
            const va=d3*d6-d5*d4; if(va<=0&&(d4-d3)>=0&&(d5-d6)>=0){const w=(d4-d3)/((d4-d3)+(d5-d6));return len2(sub(p,add(b,mul(sub(c,b),w))));}
            const denom=1/(va+vb+vc),v=vb*denom,w=vc*denom;return len2(sub(p,add(a,add(mul(ab,v),mul(ac,w)))));
          }
          function segSegDist2(p1,q1,p2,q2){
            const d1=sub(q1,p1),d2=sub(q2,p2),r=sub(p1,p2);const a=dot(d1,d1),e=dot(d2,d2),f=dot(d2,r);let s,t;
            const EPS=1e-14;
            if(a<=EPS&&e<=EPS)return len2(sub(p1,p2));
            if(a<=EPS){s=0;t=Math.max(0,Math.min(1,f/e));}
            else{const c=dot(d1,r);if(e<=EPS){t=0;s=Math.max(0,Math.min(1,-c/a));}else{const b=dot(d1,d2),den=a*e-b*b;s=den!==0?Math.max(0,Math.min(1,(b*f-c*e)/den)):0;t=(b*s+f)/e;if(t<0){t=0;s=Math.max(0,Math.min(1,-c/a));}else if(t>1){t=1;s=Math.max(0,Math.min(1,(b-c)/a));}}}
            const c1=add(p1,mul(d1,s)),c2=add(p2,mul(d2,t));return len2(sub(c1,c2));
          }
          const corners=[];for(const sx of [-1,1])for(const sy of [-1,1])for(const sz of [-1,1])corners.push([sx*half[0],sy*half[1],sz*half[2]]);
          const edgePairs=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){let diffs=0;for(let k=0;k<3;k++)if(corners[i][k]!==corners[j][k])diffs++;if(diffs===1)edgePairs.push([corners[i],corners[j]]);}
          let best2=Infinity,bestKind='none',bestTri=-1;let intersects=0;
          for(let ti=0;ti<tris.length;ti++){
            const t=tris[ti];
            if(triIntersectsBox(t)){best2=0;bestKind='intersection';bestTri=ti;intersects++;break;}
            for(const v of t){const d2=pointAabbDist2(v);if(d2<best2){best2=d2;bestKind='tri-vertex/box';bestTri=ti;}}
            for(const c of corners){const d2=pointTriDist2(c,t[0],t[1],t[2]);if(d2<best2){best2=d2;bestKind='box-vertex/tri';bestTri=ti;}}
            const te=[[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]];
            for(const a of te)for(const b of edgePairs){const d2=segSegDist2(a[0],a[1],b[0],b[1]);if(d2<best2){best2=d2;bestKind='edge-edge';bestTri=ti;}}
          }
          console.log('R3_WORST_ROCK_TRIANGLE_GAP',JSON.stringify({
            triangleCount:tris.length,
            visualGapMeters:Math.sqrt(best2),
            visualGapMm:1000*Math.sqrt(best2),
            bestKind,bestTri,intersects,
            box:{center,half,rotation:rockQ},
            priorWheelHullSeparationMm:19.95298,
            denseSupportOracleMm:18.75,
          }));
          console.log('R3_TRIANGLE_GAP_DIAGNOSTIC_OK');
          NODE
