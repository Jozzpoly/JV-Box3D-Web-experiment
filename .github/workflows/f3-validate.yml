name: f3-validate

on:
  pull_request:
    branches:
      - agent/typed-box3d-boundary
    types:
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out F3 source
        uses: actions/checkout@v4

      - name: Use project Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Strict typecheck and full regression suite
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Browser receipt, contact, and rebuild smoke
        run: node tools/smoke-f2-browser.mjs --output /tmp/F3_BROWSER_SMOKE.json
