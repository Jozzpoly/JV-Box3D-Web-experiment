name: JV Pedal Integration Close

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - .github/workflows/pedal-integration-close.yml

permissions:
  contents: read
  statuses: write

jobs:
  close:
    runs-on: windows-latest
    env:
      CANDIDATE_SHA: 315e41aa3e68baaa74ab107d3ef0b82c14a2eb84
    steps:
      - name: Record integration close pending
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @{ state = 'pending'; context = 'jv/pedal-integration-close'; description = 'Pedal foundation full integration gate running'; target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -Body $body -ContentType 'application/json'

      - name: Checkout exact integration candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup canonical Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install declared npm version
        shell: bash
        run: |
          package_manager="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$package_manager" in npm@*) ;; *) echo "Expected npm packageManager, got: $package_manager" >&2; exit 1 ;; esac
          npm install --global "$package_manager"
          test "$(node --version)" = "v$(cat .node-version)"
          test "npm@$(npm --version)" = "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Run full repository build
        run: npm run build

      - name: Record integration close success
        if: ${{ success() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @{ state = 'success'; context = 'jv/pedal-integration-close'; description = 'Pedal foundation full integration gate PASS'; target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -Body $body -ContentType 'application/json'

      - name: Record integration close failure
        if: ${{ failure() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @{ state = 'failure'; context = 'jv/pedal-integration-close'; description = 'Pedal foundation full integration gate failed'; target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -Body $body -ContentType 'application/json'
