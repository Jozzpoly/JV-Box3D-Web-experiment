name: JV Pedal Absolute Causal Check

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - .github/workflows/pedal-causal-check.yml

permissions:
  contents: read
  statuses: write

jobs:
  pedal_causal:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: e2d67ea1c675caf7c7467e1bd2df6bff0f948dc4
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record causal check pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{\"state\":\"pending\",\"context\":\"jv/pedal-absolute-causal\",\"description\":\"Focused pedal semantics validation is running\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            --data "$payload"

      - name: Checkout exact pedal candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup canonical Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install declared npm version
        run: |
          package_manager="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$package_manager" in
            npm@*) ;;
            *) echo "Expected npm packageManager, got: $package_manager" >&2; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP" && npm install --global "$package_manager")
          test "$(node --version)" = "v$(cat .node-version)"
          test "npm@$(npm --version)" = "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Run focused pedal semantics tests
        run: >-
          npm test --
          tests/analog-drive.test.mjs
          tests/clean-browser-host-analog-drive-contract.test.mjs
          tests/mobile-driving-integration-contract.test.mjs

      - name: Record causal check success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{\"state\":\"success\",\"context\":\"jv/pedal-absolute-causal\",\"description\":\"Focused pedal semantics tests PASS\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            --data "$payload"

      - name: Record causal check failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{\"state\":\"failure\",\"context\":\"jv/pedal-absolute-causal\",\"description\":\"Focused pedal semantics validation failed\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            --data "$payload"
