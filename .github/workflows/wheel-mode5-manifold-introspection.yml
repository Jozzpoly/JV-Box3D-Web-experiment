name: Wheel mode5 C manifold introspection

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - tools/wheel-mode5-manifold-introspection.mjs
      - .github/workflows/wheel-mode5-manifold-introspection.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Compile and stage runtime
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.test.json
          mkdir -p .test-dist/physics/vendor
          cp src/physics/vendor/box3d-mode5.inline.mjs .test-dist/physics/vendor/box3d-mode5.inline.mjs
      - name: Inspect known phantom and ground manifold points
        run: node tools/wheel-mode5-manifold-introspection.mjs
