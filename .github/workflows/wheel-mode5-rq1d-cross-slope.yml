name: Wheel mode5 RQ1d signed cross-slope relative-normal challenge

on:
  push:
    branches:
      - work/wheel-mode5-e2a-outer-ground-dynamic-2026-09-03
    paths:
      - tools/wheel-mode5-rq1d-patch-cross-slope.py
      - tools/wheel-mode5-rq1d-cross-slope.mjs
      - tools/wheel-mode5-rq1d-effective-profile-probe.mjs
      - .github/workflows/wheel-mode5-rq1d-cross-slope.yml

permissions:
  contents: read

jobs:
  cross-slope:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache

      - run: npm ci

      - name: Recover pinned Box3D.js and donor wheel implementation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/isaac-mason/box3d.js.git box3djs
          git -C box3djs checkout 2617a0ff763a60c9f17cee57c6ea72aab75a5077
          git -C box3djs submodule update --init --recursive
          test "$(git -C box3djs/vendor/box3d rev-parse HEAD)" = "8441b4a06d6d09dcfb0b0f704df4d847d1437b92"

          git clone https://github.com/Jozzpoly/Box3d_FunProject.git native
          git -C native fetch origin recovery/jv-reconstruction
          git -C native diff --binary \
            77a67132ffc4f003e84c6ffe4e72abfbcded4d33 \
            241fe10a9056836332c21d9614471d32d749ce3d \
            -- \
            include/box3d/box3d.h include/box3d/collision.h include/box3d/types.h \
            src/CMakeLists.txt src/contact.c src/mesh_contact.c src/physics_world.c \
            src/shape.c src/shape.h src/wheel_shape.c > B3X-WHEEL-001.patch
          test -s B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply --check ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d diff --check

      - name: Compose RQ1d binding
        shell: bash
        run: |
          set -euxo pipefail
          node --check tools/wheel-mode5-rq1d-cross-slope.mjs
          node --check tools/wheel-mode5-rq1d-effective-profile-probe.mjs
          python3 -m py_compile \
            tools/wheel-mode5-e1-patch-bindings.py \
            tools/wheel-mode5-e2a-patch-bindings.py \
            tools/wheel-mode5-rq0-patch-bindings.py \
            tools/wheel-mode5-rq0-planar-axle-patch.py \
            tools/wheel-mode5-rq1d-patch-cross-slope.py
          JV_E1_ANNULAR_SEGMENTS=128 node tools/wheel-mode5-e1-write-annular-native-header.mjs box3djs/src/e1_annular_profile.h
          python3 tools/wheel-mode5-e1-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq0-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq0-planar-axle-patch.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-rq1d-patch-cross-slope.py box3djs/src/bindings.cpp
          grep -n "rq1dRunOuterP75CrossSlope" box3djs/src/bindings.cpp
          grep -n "motionLocks.linearZ" box3djs/src/bindings.cpp
          git -C box3djs diff --check

      - name: Install Box3D.js workspace
        working-directory: box3djs
        run: pnpm install --frozen-lockfile

      - name: Build and validate pinned composition
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir box3djs build
          pnpm --dir box3djs test

      - name: Expose effective donor profile support geometry
        run: node tools/wheel-mode5-rq1d-effective-profile-probe.mjs

      - name: Execute RQ1d signed cross-slope challenge
        run: node tools/wheel-mode5-rq1d-cross-slope.mjs

      - name: Preserve RQ1d metrics
        uses: actions/upload-artifact@v6
        with:
          name: wheel-mode5-rq1d-cross-slope-result
          path: rq1d-cross-slope-result.json
          if-no-files-found: error
          retention-days: 30
