name: f2-lock-and-validate

# One controlled rerun after runtime-fault cleanup hardening.
on:
  push:
    branches:
      - agent/typed-box3d-boundary
    paths:
      - .github/workflows/f2-lock-and-validate.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out F2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact

      - name: Reinstall only from generated lockfile
        run: npm ci

      - name: Strict typecheck and deterministic tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit generated lockfile after validation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "JV F2 Lock Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock audited Box3D runtime dependency"
          git push origin HEAD:agent/typed-box3d-boundary
