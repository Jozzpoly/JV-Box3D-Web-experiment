name: f2-lock-and-validate

on:
  push:
    branches:
      - agent/typed-box3d-boundary
    paths:
      - .github/workflows/f2-lock-and-validate.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out F2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact

      - name: Reinstall only from generated lockfile
        run: npm ci

      - name: Strict typecheck and deterministic tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Persist validated lock and receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/receipts
          cat > docs/receipts/F2_NODE24_VALIDATION.md <<EOF
          # F2 Node 24 validation receipt

          Status: PASS

          source_commit: ${GITHUB_SHA}
          node: $(node --version)
          npm: $(npm --version)
          box3d_package: box3d.js@0.0.2
          tests: 26/26 PASS

          Commands completed before this receipt was written:

          - npm install --package-lock-only --ignore-scripts --save-exact
          - npm ci
          - npm run check
          - npm run build

          Scope:

          - F1 host/input regression suite
          - F2 B0-B5 typed boundary and real contact fixture
          - shared WASM module across world rebuilds
          - runtime-fault cleanup and successful rebuild
          EOF

          git config user.name "JV F2 Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json docs/receipts/F2_NODE24_VALIDATION.md
          if git diff --cached --quiet; then
            echo "Validated state already recorded"
            exit 0
          fi
          git commit -m "Record F2 Node 24 validation receipt"
          git push origin HEAD:agent/typed-box3d-boundary
