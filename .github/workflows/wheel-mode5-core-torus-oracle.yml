name: Wheel mode5 CORE torus oracle

on:
  push:
    branches:
      - work/wheel-mode5-registration-diagnostic-2026-09-02
    paths:
      - .github/workflows/wheel-mode5-core-torus-oracle.yml

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Compile and stage mode5 runtime
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.test.json
          mkdir -p .test-dist/physics/vendor
          cp src/physics/vendor/box3d-mode5.inline.mjs .test-dist/physics/vendor/box3d-mode5.inline.mjs
      - name: Compare exact CORE torus with solver-aware C on worst real rock
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { validatePinnedNativeFactoryReceiptText } from './.test-dist/config/native-factory-receipt.js';
          import { loadMode5Box3DModule } from './.test-dist/physics/mode5-box3d-runtime.js';
          import { createE2rWorld } from './.test-dist/scene/e2r-world.js';
          import { m6TopologyConfigFromReceipt } from './.test-dist/vehicle/m6/m6-topology-config.js';
          import {
            createMode5WheelForGeometry,
            MODE5_SOLVER_AWARE_PROFILE_GEOMETRY,
          } from './.test-dist/vehicle/m6/mode5-wheel-backend.js';

          const receipt = await validatePinnedNativeFactoryReceiptText(
            await readFile('public/receipts/jv_m6_factory_receipt.json', 'utf8'),
          );
          const config = m6TopologyConfigFromReceipt(receipt);
          const b3 = await loadMode5Box3DModule();
          if (typeof b3.b3CreateCapsuleShape !== 'function') throw new Error('capsule export disappeared');

          const root = 'owner-ab/vehicles/m6-owner-r3';
          const pkg = JSON.parse(await readFile(`${root}/m6-owner-full-rig-r3.visual.json`, 'utf8'));
          const glb = new Uint8Array(await readFile(`${root}/models/m6-owner-full-rig-r3.glb`));
          const view = new DataView(glb.buffer, glb.byteOffset, glb.byteLength);
          if (view.getUint32(0,true)!==0x46546c67) throw new Error('R3 is not GLB');
          const jsonLength=view.getUint32(12,true);
          const json=JSON.parse(new TextDecoder().decode(glb.slice(20,20+jsonLength)).trim());
          const binaryHeader=20+jsonLength;
          const binaryLength=view.getUint32(binaryHeader,true);
          const binary=glb.slice(binaryHeader+8,binaryHeader+8+binaryLength);
          const dv=new DataView(binary.buffer,binary.byteOffset,binary.byteLength);
          const binding=pkg.bindings.find(b=>b.bindingId==='owner.fl.wheel');
          if(!binding) throw new Error('missing FL binding');
          const node=json.nodes.find(n=>n.name===binding.nodeName);
          if(!node || node.mesh===undefined) throw new Error(`missing mesh for ${binding.nodeName}`);

          function componentReader(componentType) {
            if(componentType===5120) return {bytes:1, read:(o)=>dv.getInt8(o)};
            if(componentType===5121) return {bytes:1, read:(o)=>dv.getUint8(o)};
            if(componentType===5122) return {bytes:2, read:(o)=>dv.getInt16(o,true)};
            if(componentType===5123) return {bytes:2, read:(o)=>dv.getUint16(o,true)};
            if(componentType===5125) return {bytes:4, read:(o)=>dv.getUint32(o,true)};
            if(componentType===5126) return {bytes:4, read:(o)=>dv.getFloat32(o,true)};
            throw new Error(`unsupported component ${componentType}`);
          }
          function typeCount(type){const n={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[type];if(!n)throw new Error(`type ${type}`);return n;}
          function readAccessor(index){
            const a=json.accessors[index], bv=json.bufferViews[a.bufferView], reader=componentReader(a.componentType), n=typeCount(a.type);
            const stride=bv.byteStride??reader.bytes*n, start=(bv.byteOffset??0)+(a.byteOffset??0), out=[];
            for(let i=0;i<a.count;i++){const row=[];for(let c=0;c<n;c++)row.push(reader.read(start+i*stride+c*reader.bytes));out.push(n===1?row[0]:row);}
            return out;
          }
          const triangles=[];
          for(const primitive of json.meshes[node.mesh].primitives){
            if(primitive.mode!==undefined && primitive.mode!==4) throw new Error('non-triangle primitive');
            const pos=readAccessor(primitive.attributes.POSITION);
            const idx=primitive.indices!==undefined?readAccessor(primitive.indices):pos.map((_,i)=>i);
            for(let i=0;i<idx.length;i+=3)triangles.push([pos[idx[i]],pos[idx[i+1]],pos[idx[i+2]]]);
          }

          function qnorm(q){const l=Math.hypot(q.x,q.y,q.z,q.w);return {x:q.x/l,y:q.y/l,z:q.z/l,w:q.w/l};}
          function qrot(q,v){q=qnorm(q);const {x,y,z,w}=q;const uv=[y*v[2]-z*v[1],z*v[0]-x*v[2],x*v[1]-y*v[0]];const uuv=[y*uv[2]-z*uv[1],z*uv[0]-x*uv[2],x*uv[1]-y*uv[0]];return [v[0]+2*(w*uv[0]+uuv[0]),v[1]+2*(w*uv[1]+uuv[1]),v[2]+2*(w*uv[2]+uuv[2])];}
          function qinv(q){return {x:-q.x,y:-q.y,z:-q.z,w:q.w};}
          function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
          function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
          function mul(a,s){return [a[0]*s,a[1]*s,a[2]*s];}
          function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
          function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
          function len2(a){return dot(a,a);}
          function pointTriDist2(p,a,b,c){
            const ab=sub(b,a),ac=sub(c,a),ap=sub(p,a);const d1=dot(ab,ap),d2=dot(ac,ap);if(d1<=0&&d2<=0)return len2(ap);
            const bp=sub(p,b),d3=dot(ab,bp),d4=dot(ac,bp);if(d3>=0&&d4<=d3)return len2(bp);
            const vc=d1*d4-d3*d2;if(vc<=0&&d1>=0&&d3<=0){const v=d1/(d1-d3);return len2(sub(p,add(a,mul(ab,v))));}
            const cp=sub(p,c),d5=dot(ab,cp),d6=dot(ac,cp);if(d6>=0&&d5<=d6)return len2(cp);
            const vb=d5*d2-d1*d6;if(vb<=0&&d2>=0&&d6<=0){const w=d2/(d2-d6);return len2(sub(p,add(a,mul(ac,w))));}
            const va=d3*d6-d5*d4;if(va<=0&&(d4-d3)>=0&&(d5-d6)>=0){const w=(d4-d3)/((d4-d3)+(d5-d6));return len2(sub(p,add(b,mul(sub(c,b),w))));}
            const denom=1/(va+vb+vc),v=vb*denom,w=vc*denom;return len2(sub(p,add(a,add(mul(ab,v),mul(ac,w)))));
          }
          function segSegDist2(p1,q1,p2,q2){
            const d1=sub(q1,p1),d2=sub(q2,p2),r=sub(p1,p2),a=dot(d1,d1),e=dot(d2,d2),f=dot(d2,r);let s,t;const EPS=1e-14;
            if(a<=EPS&&e<=EPS)return len2(sub(p1,p2));
            if(a<=EPS){s=0;t=Math.max(0,Math.min(1,f/e));}
            else{const c=dot(d1,r);if(e<=EPS){t=0;s=Math.max(0,Math.min(1,-c/a));}else{const b=dot(d1,d2),den=a*e-b*b;s=den!==0?Math.max(0,Math.min(1,(b*f-c*e)/den)):0;t=(b*s+f)/e;if(t<0){t=0;s=Math.max(0,Math.min(1,-c/a));}else if(t>1){t=1;s=Math.max(0,Math.min(1,(b-c)/a));}}}
            return len2(sub(add(p1,mul(d1,s)),add(p2,mul(d2,t))));
          }
          function triangleBoxGap(trianglesLocal, bodyQ, box){
            const qi=qinv(box.rotation),half=[box.halfExtents.x,box.halfExtents.y,box.halfExtents.z],center=[box.center.x,box.center.y,box.center.z];
            const toBox=p=>qrot(qi,sub(qrot(bodyQ,p),center));
            const tris=trianglesLocal.map(t=>t.map(toBox));
            function pointAabbDist2(p){let d2=0;for(let k=0;k<3;k++){const d=Math.max(Math.abs(p[k])-half[k],0);d2+=d*d;}return d2;}
            function axisSeparates(axis,tri){const l2=len2(axis);if(l2<1e-18)return false;const p=tri.map(v=>dot(v,axis)),mn=Math.min(...p),mx=Math.max(...p);const r=half[0]*Math.abs(axis[0])+half[1]*Math.abs(axis[1])+half[2]*Math.abs(axis[2]);return mn>r||mx<-r;}
            function triIntersectsBox(tri){const e=[sub(tri[1],tri[0]),sub(tri[2],tri[1]),sub(tri[0],tri[2])],axes=[[1,0,0],[0,1,0],[0,0,1],cross(e[0],e[1])];for(const edge of e)axes.push(cross(edge,[1,0,0]),cross(edge,[0,1,0]),cross(edge,[0,0,1]));return !axes.some(a=>axisSeparates(a,tri));}
            const corners=[];for(const sx of [-1,1])for(const sy of [-1,1])for(const sz of [-1,1])corners.push([sx*half[0],sy*half[1],sz*half[2]]);
            const edgePairs=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){let d=0;for(let k=0;k<3;k++)if(corners[i][k]!==corners[j][k])d++;if(d===1)edgePairs.push([corners[i],corners[j]]);}
            let best2=Infinity;
            for(const t of tris){
              if(triIntersectsBox(t))return 0;
              for(const v of t)best2=Math.min(best2,pointAabbDist2(v));
              for(const c of corners)best2=Math.min(best2,pointTriDist2(c,t[0],t[1],t[2]));
              const te=[[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]];for(const a of te)for(const e of edgePairs)best2=Math.min(best2,segSegDist2(a[0],a[1],e[0],e[1]));
            }
            return Math.sqrt(best2);
          }

          function makeShapeDef(groupIndex){
            const d=b3.b3DefaultShapeDef();d.density=config.wheelDensity;d.baseMaterial.friction=config.wheelFriction;d.baseMaterial.restitution=0.02;d.baseMaterial.rollingResistance=config.wheelRollingResistance;d.filter.groupIndex=groupIndex;d.enableContactEvents=true;return d;
          }
          function createBody(worldId){
            const d=b3.b3DefaultBodyDef();d.type=b3.b3BodyType.b3_dynamicBody;d.rotation=b3.b3ComputeQuatBetweenUnitVectors({x:0,y:1,z:0},{x:0,y:0,z:1});d.allowFastRotation=true;return b3.b3CreateBody(worldId,d);
          }
          function createCoreTorus(worldId,groupIndex){
            const bodyId=createBody(worldId);
            const ref=b3.b3CreateSphereShape(bodyId,makeShapeDef(groupIndex),{center:{x:0,y:0,z:0},radius:config.wheelRadius});
            const mass=b3.b3Body_GetMassData(bodyId);b3.b3DestroyShape(ref,false);
            const halfWidth=0.5*config.wheelWidth,crown=0.914*halfWidth,ring=config.wheelRadius-crown,halfLen=halfWidth-crown,segments=64,shapeIds=[];
            for(let i=0;i<segments;i++){const a=2*Math.PI*i/segments,x=ring*Math.cos(a),z=ring*Math.sin(a);shapeIds.push(b3.b3CreateCapsuleShape(bodyId,makeShapeDef(groupIndex),{center1:{x,y:-halfLen,z},center2:{x,y:+halfLen,z},radius:crown}));}
            b3.b3Body_SetMassData(bodyId,mass);
            return {bodyId,shapeIds,contract:{halfWidth,crown,ring,halfLen,segments}};
          }
          function createC(worldId,groupIndex){const w=createMode5WheelForGeometry(MODE5_SOLVER_AWARE_PROFILE_GEOMETRY,b3,worldId,config,{x:0,y:0,z:0},groupIndex);return {bodyId:w.bodyId,shapeIds:[w.rollingShapeId],contract:{profileId:w.profileId,cornerRadius:w.cornerRadius}};}
          function createRock(worldId,box){const bd=b3.b3DefaultBodyDef();bd.position=box.center;bd.rotation={v:{x:box.rotation.x,y:box.rotation.y,z:box.rotation.z},s:box.rotation.w};const bodyId=b3.b3CreateBody(worldId,bd);const sd=b3.b3DefaultShapeDef();sd.enableContactEvents=true;b3.b3CreateBoxShape(bodyId,sd,box.halfExtents.x,box.halfExtents.y,box.halfExtents.z);}
          function contactSummary(shapeIds){let contacts=0,points=0,minSeparation=Infinity,maxImpulse=0;for(const shapeId of shapeIds){const buf=b3.createContactsBuffer();try{b3.getShapeContactData(buf,shapeId);contacts+=b3.getNumContacts(buf);for(let i=0;i<b3.getNumContacts(buf);i++){const c=b3.getContactAt(b3.createContact(),buf,i);for(let m=0;m<c.manifoldCount;m++){const man=b3.getManifoldAt(b3.createManifold(),c,m);for(let p=0;p<man.pointCount;p++){const cp=man.points[p];points++;minSeparation=Math.min(minSeparation,cp.separation);maxImpulse=Math.max(maxImpulse,cp.totalNormalImpulse??cp.normalImpulse??0);}}}}finally{b3.destroyContactsBuffer(buf);}}return {contacts,points,minSeparation:Number.isFinite(minSeparation)?minSeparation:null,maxImpulse};}
          function isolatedAt(kind,template,direction,distance){
            const wd=b3.b3DefaultWorldDef();wd.gravity={x:0,y:0,z:0};wd.enableContinuous=false;const worldId=b3.b3CreateWorld(wd);
            try{const wheel=kind==='torus'?createCoreTorus(worldId,-9101):createC(worldId,-9102);const box={...template,center:{x:direction.x*distance,y:direction.y*distance,z:direction.z*distance}};createRock(worldId,box);b3.b3World_Step(worldId,1/60,4);const bodyQ={x:Math.SQRT1_2,y:0,z:0,w:Math.SQRT1_2};const visualGap=triangleBoxGap(triangles,bodyQ,box);return {kind,distance,visualGap,contact:contactSummary(wheel.shapeIds),contract:wheel.contract};}finally{b3.b3DestroyWorld(worldId);}
          }
          function findOnset(kind,template,direction,far0=1.25,near0=0.20){let far=far0,near=near0;const f=isolatedAt(kind,template,direction,far),n=isolatedAt(kind,template,direction,near);if(f.contact.contacts!==0)throw new Error(`${kind} far contacts`);if(n.contact.contacts===0)throw new Error(`${kind} near has no contact`);for(let i=0;i<14;i++){const mid=0.5*(far+near),r=isolatedAt(kind,template,direction,mid);if(r.contact.contacts>0)near=mid;else far=mid;}return isolatedAt(kind,template,direction,near);}

          const rocks=createE2rWorld().boxes.slice(9);
          const rock=rocks[45];
          const d0={x:0.15,y:-0.25,z:1};const dl=Math.hypot(d0.x,d0.y,d0.z);const dir={x:d0.x/dl,y:d0.y/dl,z:d0.z/dl};
          const worst={C:findOnset('C',rock,dir),torus:findOnset('torus',rock,dir)};

          const wall={halfExtents:{x:0.05,y:1,z:1},rotation:{x:0,y:0,z:0,w:1}};
          const radialDir={x:1,y:0,z:0};
          const radial={C:findOnset('C',wall,radialDir,1.5,0.2),torus:findOnset('torus',wall,radialDir,1.5,0.2)};
          const visibleRadial=0.5417423844337463;
          for(const key of ['C','torus'])radial[key].onsetMinusVisible=(radial[key].distance-wall.halfExtents.x)-visibleRadial;

          console.log('MODE5_CORE_TORUS_ORACLE_WORST_ROCK',JSON.stringify({rockIndex:45,direction:dir,halfExtents:rock.halfExtents,rotation:rock.rotation,...worst,visualGapImprovementMeters:worst.C.visualGap-worst.torus.visualGap}));
          console.log('MODE5_CORE_TORUS_ORACLE_RADIAL',JSON.stringify(radial));
          if(radial.torus.onsetMinusVisible>0.01)throw new Error(`CORE torus contacts >10mm before visible radial tread: ${radial.torus.onsetMinusVisible}`);
          console.log('MODE5_CORE_TORUS_ORACLE_OK');
          NODE
