name: Wheel mode5 canonical ledger refresh through RQ2C4F hold

on:
  push:
    branches:
      - research/wheel-mode5-rq2c-orientation-2026-09-05
    paths:
      - tools/wheel-mode5/ledger/refresh-canonical-ledger-through-rq2c4f-hold.mjs
      - .github/workflows/wheel-mode5-ledger-refresh-rq2c4f-hold.yml

permissions:
  contents: write

jobs:
  refresh-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - name: Refresh and validate canonical evidence ledger
        run: |
          set -euxo pipefail
          node tools/wheel-mode5/ledger/refresh-canonical-ledger-through-rq2c4f-hold.mjs
          node -e "const fs=require('fs'); const p='docs/evidence/WHEEL_MODE5_CANONICAL_EVIDENCE_LEDGER_2026-09-05.json'; const x=JSON.parse(fs.readFileSync(p)); if(x.records.length!==25) throw new Error('record count drift '+x.records.length); if(x.records.at(-1).id!=='RQ2C4F_SOURCE_OWNERSHIP_CLOSURE') throw new Error('tail drift'); if(x.currentMilestone?.status!=='CLOSED_HOLD_AT_0DEG_SLIP_GATE') throw new Error('milestone drift'); if(x.currentMilestone?.next!==null) throw new Error('next gate reopened');"
          git diff --check
          git diff -- docs/evidence/WHEEL_MODE5_CANONICAL_EVIDENCE_LEDGER_2026-09-05.json
      - name: Commit validated ledger refresh
        run: |
          set -euxo pipefail
          test -n "$(git status --porcelain -- docs/evidence/WHEEL_MODE5_CANONICAL_EVIDENCE_LEDGER_2026-09-05.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/WHEEL_MODE5_CANONICAL_EVIDENCE_LEDGER_2026-09-05.json
          git commit -m "research: refresh canonical ledger through RQ2C4F hold"
          git push origin HEAD:research/wheel-mode5-rq2c-orientation-2026-09-05
