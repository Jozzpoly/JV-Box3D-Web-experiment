name: JV Owner Preview Live Smoke

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - preview/owner.json
      - preview/owner-ab.json
      - .github/workflows/owner-preview-live-smoke.yml

permissions:
  contents: read

concurrency:
  group: jv-owner-preview-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout preview control lane
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify deployed Owner Preview and wheel A-B
        env:
          BASE_URL: https://jozzpoly.github.io/JV-Box3D-Web-experiment/
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = os.environ["BASE_URL"].rstrip("/") + "/"
          owner = json.loads(Path("preview/owner.json").read_text(encoding="utf-8"))
          ab = json.loads(Path("preview/owner-ab.json").read_text(encoding="utf-8"))
          expected_root = owner["sourceCommit"]
          expected_ab = ab["sourceCommit"]

          def fetch(relative, attempt):
              separator = "&" if "?" in relative else "?"
              url = urllib.parse.urljoin(base, relative) + f"{separator}jv_smoke={expected_ab[:12]}-{attempt}"
              request = urllib.request.Request(
                  url,
                  headers={"Cache-Control": "no-cache", "User-Agent": "JV-Web-Owner-Preview-Smoke/1"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status} for {url}")
                  return response.read(), response.headers.get_content_type(), url

          def fetch_json(relative, attempt):
              payload, _, url = fetch(relative, attempt)
              try:
                  return json.loads(payload.decode("utf-8")), url
              except Exception as error:
                  raise RuntimeError(f"Invalid JSON at {url}: {error}") from error

          def validate_html_tree(relative, attempt):
              payload, _, url = fetch(relative, attempt)
              html = payload.decode("utf-8")
              if "<html" not in html.lower() or "</html>" not in html.lower():
                  raise RuntimeError(f"Expected HTML document at {url}")
              refs = []
              refs.extend(re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I))
              refs.extend(re.findall(r'<link[^>]+href=["\']([^"\']+)["\']', html, flags=re.I))
              local_refs = [ref for ref in refs if not ref.startswith(("http://", "https://", "data:", "#"))]
              if not local_refs:
                  raise RuntimeError(f"No local executable/style assets referenced by {url}")
              root = relative if relative.endswith("/") else relative.rsplit("/", 1)[0] + "/"
              for ref in local_refs:
                  target = urllib.parse.urljoin(root, ref)
                  fetch(target, attempt)

          last_error = None
          for attempt in range(1, 25):
              try:
                  root_manifest, _ = fetch_json("build-manifest.json", attempt)
                  if root_manifest.get("source", {}).get("commit") != expected_root:
                      raise RuntimeError(
                          f"accepted root source is {root_manifest.get('source', {}).get('commit')}, expected {expected_root}"
                      )

                  index, _ = fetch_json("__experiments__/wheel-mode5/index.json", attempt)
                  if (
                      index.get("schema") != "JV_OWNER_AB_INDEX_V1"
                      or index.get("sourceCommit") != expected_ab
                      or index.get("sameSource") is not True
                      or index.get("variants") != [
                          {"id": "flat-control", "path": "flat/"},
                          {"id": "asset-profile", "path": "profile/"},
                      ]
                  ):
                      raise RuntimeError(f"wheel A-B index mismatch: {index!r}")

                  expected = {
                      "flat": "flat-control",
                      "profile": "asset-profile",
                  }
                  for path, variant in expected.items():
                      marker, _ = fetch_json(
                          f"__experiments__/wheel-mode5/{path}/owner-ab-variant.json",
                          attempt,
                      )
                      manifest, _ = fetch_json(
                          f"__experiments__/wheel-mode5/{path}/build-manifest.json",
                          attempt,
                      )
                      if marker.get("sourceCommit") != expected_ab or marker.get("variant") != variant:
                          raise RuntimeError(f"{path} marker mismatch: {marker!r}")
                      if manifest.get("source", {}).get("commit") != expected_ab:
                          raise RuntimeError(f"{path} manifest source mismatch")
                      validate_html_tree(f"__experiments__/wheel-mode5/{path}/", attempt)

                  print(
                      "JV_OWNER_PREVIEW_LIVE_SMOKE_OK",
                      f"root={expected_root}",
                      f"ab={expected_ab}",
                      f"base={base}",
                  )
                  break
              except Exception as error:
                  last_error = error
                  if attempt == 24:
                      raise
                  print(f"Live Pages not coherent yet (attempt {attempt}/24): {error}")
                  time.sleep(10)
          else:
              raise RuntimeError(str(last_error))
          PY
