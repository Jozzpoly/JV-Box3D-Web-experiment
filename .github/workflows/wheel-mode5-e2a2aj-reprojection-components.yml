name: Wheel mode5 E2a2aj reprojection component decomposition

on:
  push:
    branches:
      - work/wheel-mode5-e2a-outer-ground-dynamic-2026-09-03
    paths:
      - tools/wheel-mode5-e2a2aj-patch-reprojection-components.py
      - tools/wheel-mode5-e2a2aj-patch-fixed-ground-component-binding.py
      - tools/wheel-mode5-e2a2aj-reprojection-components.mjs
      - .github/workflows/wheel-mode5-e2a2aj-reprojection-components.yml

permissions:
  contents: read

jobs:
  reprojection-component-decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache
      - run: npm ci

      - name: Recover pinned mode5 Box3D.js source and donor wheel patch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/isaac-mason/box3d.js.git box3djs
          git -C box3djs checkout 2617a0ff763a60c9f17cee57c6ea72aab75a5077
          git -C box3djs submodule update --init --recursive
          test "$(git -C box3djs/vendor/box3d rev-parse HEAD)" = "8441b4a06d6d09dcfb0b0f704df4d847d1437b92"
          git clone https://github.com/Jozzpoly/Box3d_FunProject.git native
          git -C native fetch origin recovery/jv-reconstruction
          git -C native diff --binary \
            77a67132ffc4f003e84c6ffe4e72abfbcded4d33 \
            241fe10a9056836332c21d9614471d32d749ce3d \
            -- \
            include/box3d/box3d.h include/box3d/collision.h include/box3d/types.h \
            src/CMakeLists.txt src/contact.c src/mesh_contact.c src/physics_world.c \
            src/shape.c src/shape.h src/wheel_shape.c > B3X-WHEEL-001.patch
          test -s B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply --check ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d apply ../../../B3X-WHEEL-001.patch
          git -C box3djs/vendor/box3d diff --check

      - name: Compose validated solver plus E2a2aj diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/wheel-mode5-e1-patch-bindings.py \
            tools/wheel-mode5-e2a-patch-bindings.py \
            tools/wheel-mode5-e2a2-patch-bindings.py \
            tools/wheel-mode5-e2a2b-patch-bindings.py \
            tools/wheel-mode5-e2a2c-patch-bindings.py \
            tools/wheel-mode5-e2a2d-patch-bindings.py \
            tools/wheel-mode5-e2a2e-patch-bindings.py \
            tools/wheel-mode5-e2a2f-patch-bindings.py \
            tools/wheel-mode5-e2a2g-patch-bindings.py \
            tools/wheel-mode5-e2a2i-patch-bindings.py \
            tools/wheel-mode5-e2a2p-patch-tilt-lock-binding.py \
            tools/wheel-mode5-e2a2k-r2-patch-counterfactual-convex-solver.py \
            tools/wheel-mode5-e2a2p-patch-simultaneous-two-point-solve.py \
            tools/wheel-mode5-e2a2p-r2-normalize-generated-tabs.py \
            tools/wheel-mode5-e2a2q-patch-coupled-two-point-lcp.py \
            tools/wheel-mode5-e2a2q-r2-patch-pinned-mask-helpers.py \
            tools/wheel-mode5-e2a2q-patch-bindings.py \
            tools/wheel-mode5-e2a2u-patch-dynamic-transition-binding.py \
            tools/wheel-mode5-e2a2v-patch-recycling-control-binding.py \
            tools/wheel-mode5-e2a2y-patch-static-ground-transform-binding.py \
            tools/wheel-mode5-e2a2z-patch-static-ground-rate-binding.py \
            tools/wheel-mode5-e2a2af-patch-fixed-ground-wheel-motion-binding.py \
            tools/wheel-mode5-e2a2aj-patch-reprojection-components.py \
            tools/wheel-mode5-e2a2aj-patch-fixed-ground-component-binding.py
          node --check tools/wheel-mode5-e2a2aj-reprojection-components.mjs
          JV_E1_ANNULAR_SEGMENTS=128 node tools/wheel-mode5-e1-write-annular-native-header.mjs box3djs/src/e1_annular_profile.h
          node tools/wheel-mode5-e2a2-write-flat-support-header.mjs box3djs/src/e2a2_flat_support.h
          python3 tools/wheel-mode5-e1-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2b-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2c-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2d-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2e-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2f-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2g-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2i-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2p-patch-tilt-lock-binding.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2k-r2-patch-counterfactual-convex-solver.py box3djs/vendor/box3d/src/contact_solver.c
          python3 tools/wheel-mode5-e2a2p-patch-simultaneous-two-point-solve.py box3djs/vendor/box3d/src/contact_solver.c
          python3 tools/wheel-mode5-e2a2p-r2-normalize-generated-tabs.py box3djs/vendor/box3d/src/contact_solver.c
          python3 tools/wheel-mode5-e2a2q-patch-coupled-two-point-lcp.py box3djs/vendor/box3d/src/contact_solver.c
          python3 tools/wheel-mode5-e2a2q-r2-patch-pinned-mask-helpers.py box3djs/vendor/box3d/src/contact_solver.c
          python3 tools/wheel-mode5-e2a2q-patch-bindings.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2u-patch-dynamic-transition-binding.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2v-patch-recycling-control-binding.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2y-patch-static-ground-transform-binding.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2z-patch-static-ground-rate-binding.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2af-patch-fixed-ground-wheel-motion-binding.py box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2aj-patch-reprojection-components.py box3djs/vendor/box3d/src/physics_world.c box3djs/src/bindings.cpp
          python3 tools/wheel-mode5-e2a2aj-patch-fixed-ground-component-binding.py box3djs/src/bindings.cpp
          git -C box3djs/vendor/box3d diff --check
          grep -F 'e2a2ajRunFixedGroundReprojectionComponents' box3djs/src/bindings.cpp

      - name: Install Box3D.js workspace
        working-directory: box3djs
        run: pnpm install --frozen-lockfile

      - name: Build E2a2aj diagnostic binary
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir box3djs build >/dev/null
          pnpm --dir box3djs test >/dev/null

      - name: Execute E2a2aj reprojection decomposition
        run: node tools/wheel-mode5-e2a2aj-reprojection-components.mjs
