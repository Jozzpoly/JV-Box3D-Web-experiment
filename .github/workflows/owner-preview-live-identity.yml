name: JV Owner Preview live identity probe

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - .github/workflows/owner-preview-live-identity.yml
      - preview/owner.json

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview control lane
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve expected source SHA
        id: expected
        shell: bash
        run: |
          sha="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('preview/owner.json').read_text())['sourceCommit'])
          PY
          )"
          test "${#sha}" = 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mark live identity pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.expected.outputs.sha }}',
              state: 'pending',
              context: 'jv/owner-preview-live-identity',
              description: 'Checking live Owner Preview composition identity'
            });

      - name: Poll live Owner Preview composition
        id: probe
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
          LIVE_URL: https://jozzpoly.github.io/JV-Box3D-Web-experiment/owner-preview-composition.json
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            probe_url="${LIVE_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}"
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$probe_url" -o "$RUNNER_TEMP/composition.json"; then
              actual="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('composition.json').read_text())
          print(data.get('executableSource', {}).get('commit', ''))
          PY
              )"
              echo "Attempt $attempt: live source=$actual expected=$EXPECTED_SHA"
              if [ "$actual" = "$EXPECTED_SHA" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1

      - name: Record live identity result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.probe.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.expected.outputs.sha }}',
              state: outcome === 'success' ? 'success' : 'failure',
              context: 'jv/owner-preview-live-identity',
              description: outcome === 'success'
                ? 'Live Owner Preview serves exact candidate identity'
                : 'Live Owner Preview does not serve exact candidate identity'
            });
