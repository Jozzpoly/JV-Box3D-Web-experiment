name: Wheel mode5 E2a profile support scan

on:
  push:
    branches:
      - work/wheel-mode5-e2a-outer-ground-dynamic-2026-09-03
    paths:
      - tools/wheel-mode5-e2a-profile-support-scan.mjs
      - .github/workflows/wheel-mode5-e2a-profile-support-scan.yml

permissions:
  contents: read

jobs:
  profile-support-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Scan recovered P75 outer support profile
        run: node tools/wheel-mode5-e2a-profile-support-scan.mjs
