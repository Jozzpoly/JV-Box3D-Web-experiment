name: Wheel mode5 T65 pre-solve multiplicity coastdown

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - tools/wheel-mode5-torus-presolve-coastdown.mjs
      - .github/workflows/wheel-mode5-torus-presolve-coastdown.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Compile exact T65 geometry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/vehicle/m6/mode5-wheel-backend.ts')
          text=path.read_text(encoding='utf-8')
          old_select='const requestedGeometry = import.meta.env?.["VITE_JV_MODE5_WHEEL_GEOMETRY"];'
          new_select='const requestedGeometry: string | undefined = "core-torus64";'
          old_ratio='export const MODE5_CORE_TORUS_CROWN_RATIO = 0.914;'
          new_ratio='export const MODE5_CORE_TORUS_CROWN_RATIO = 0.65;'
          if text.count(old_select)!=1 or text.count(old_ratio)!=1:
              raise SystemExit('T65 source anchors drifted')
          path.write_text(text.replace(old_select,new_select).replace(old_ratio,new_ratio),encoding='utf-8')
          PY
          rm -rf .test-dist
          node node_modules/typescript/bin/tsc -p tsconfig.test.json
          mkdir -p .test-dist/physics/vendor
          cp src/physics/vendor/box3d-mode5.inline.mjs .test-dist/physics/vendor/box3d-mode5.inline.mjs
      - name: Compare PASSALL vs bounded sector response
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/presolve-results.jsonl"
          for mode in PASSALL NEAREST1 NEAREST3; do
            JV_PRESOLVE_MODE="$mode" node tools/wheel-mode5-torus-presolve-coastdown.mjs | tee "$RUNNER_TEMP/$mode.log"
            grep '^TORUS_PRESOLVE_COASTDOWN ' "$RUNNER_TEMP/$mode.log" \
              | sed 's/^TORUS_PRESOLVE_COASTDOWN //' >> "$RUNNER_TEMP/presolve-results.jsonl"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=[json.loads(line) for line in Path(os.environ['RUNNER_TEMP'],'presolve-results.jsonl').read_text().splitlines() if line.strip()]
          if [row['mode'] for row in rows] != ['PASSALL','NEAREST1','NEAREST3']:
              raise SystemExit(f'unexpected result rows: {[row["mode"] for row in rows]}')
          p,n1,n3=rows
          if p['capturedTorusShapes'] != 256:
              raise SystemExit(f'PASSALL did not recover 256 torus shapes: {p["capturedTorusShapes"]}')

          # PASSALL is a causal control. Pre-solve callback invocations are NOT the
          # same quantity as world contact-graph entries, so validate the control
          # against the previously executed T65 physical coast-down instead.
          historical_distance=14.579286132301235
          historical_end_speed=0.000058632352200648085
          historical_world_contacts=56.416666666666664
          if abs(p['coast']['distanceMeters']-historical_distance) > 0.02:
              raise SystemExit(f'PASSALL distance lost prior T65 parity: {p["coast"]["distanceMeters"]}')
          if abs(p['coast']['endSpeed']-historical_end_speed) > 0.01:
              raise SystemExit(f'PASSALL end speed lost prior T65 parity: {p["coast"]["endSpeed"]}')
          if abs(p['coast']['meanWorldContacts']-historical_world_contacts) > 1.0:
              raise SystemExit(f'PASSALL contact graph lost prior T65 parity: {p["coast"]["meanWorldContacts"]}')

          # Verify the selector did what this experiment claims. These are active
          # solver responses observed by the pre-solve callback, not graph contacts.
          if abs(n1['coast']['meanAccepted']-4.0) > 0.05 or n1['coast']['minAccepted'] != 4 or n1['coast']['maxAccepted'] != 4:
              raise SystemExit(f'NEAREST1 did not hold one active sector per wheel: {n1["coast"]}')
          if n3['coast']['meanAccepted'] <= n1['coast']['meanAccepted']:
              raise SystemExit('NEAREST3 did not retain more solver responses than NEAREST1')

          comparison={
            'PASSALL':p['coast'],
            'NEAREST1':n1['coast'],
            'NEAREST3':n3['coast'],
            'C_REFERENCE':{
              'distanceMeters':34.219356252641596,
              'endSpeed':2.851984383050456,
              'speedRetention':0.708638920370617,
              'meanWorldContacts':4.0,
              'sourceRun':33697823815,
            },
            'ratios':{
              'NEAREST1_distance_vs_PASSALL':n1['coast']['distanceMeters']/p['coast']['distanceMeters'],
              'NEAREST3_distance_vs_PASSALL':n3['coast']['distanceMeters']/p['coast']['distanceMeters'],
              'NEAREST1_distance_vs_C':n1['coast']['distanceMeters']/34.219356252641596,
              'NEAREST1_end_speed_vs_C':n1['coast']['endSpeed']/2.851984383050456,
              'NEAREST1_retention_vs_C':n1['coast']['speedRetention']/0.708638920370617,
            }
          }
          print('TORUS_PRESOLVE_COMPARISON',json.dumps(comparison,separators=(',',':')))
          print('TORUS_PRESOLVE_COMPARISON_OK')
          PY
