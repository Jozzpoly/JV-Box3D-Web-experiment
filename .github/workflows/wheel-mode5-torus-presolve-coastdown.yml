name: Wheel mode5 T65 pre-solve multiplicity coastdown

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - tools/wheel-mode5-torus-presolve-coastdown.mjs
      - .github/workflows/wheel-mode5-torus-presolve-coastdown.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Compile exact T65 geometry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/vehicle/m6/mode5-wheel-backend.ts')
          text=path.read_text(encoding='utf-8')
          old_select='const requestedGeometry = import.meta.env?.["VITE_JV_MODE5_WHEEL_GEOMETRY"];'
          new_select='const requestedGeometry: string | undefined = "core-torus64";'
          old_ratio='export const MODE5_CORE_TORUS_CROWN_RATIO = 0.914;'
          new_ratio='export const MODE5_CORE_TORUS_CROWN_RATIO = 0.65;'
          if text.count(old_select)!=1 or text.count(old_ratio)!=1:
              raise SystemExit('T65 source anchors drifted')
          path.write_text(text.replace(old_select,new_select).replace(old_ratio,new_ratio),encoding='utf-8')
          PY
          rm -rf .test-dist
          node node_modules/typescript/bin/tsc -p tsconfig.test.json
          mkdir -p .test-dist/physics/vendor
          cp src/physics/vendor/box3d-mode5.inline.mjs .test-dist/physics/vendor/box3d-mode5.inline.mjs
      - name: Compare PASSALL vs bounded sector response
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/presolve-results.jsonl"
          for mode in PASSALL NEAREST1 NEAREST3; do
            JV_PRESOLVE_MODE="$mode" node tools/wheel-mode5-torus-presolve-coastdown.mjs | tee "$RUNNER_TEMP/$mode.log"
            grep '^TORUS_PRESOLVE_COASTDOWN ' "$RUNNER_TEMP/$mode.log" \
              | sed 's/^TORUS_PRESOLVE_COASTDOWN //' >> "$RUNNER_TEMP/presolve-results.jsonl"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=[json.loads(line) for line in Path(os.environ['RUNNER_TEMP'],'presolve-results.jsonl').read_text().splitlines() if line.strip()]
          if [row['mode'] for row in rows] != ['PASSALL','NEAREST1','NEAREST3']:
              raise SystemExit(f'unexpected result rows: {[row["mode"] for row in rows]}')
          p,n1,n3=rows
          if p['capturedTorusShapes'] != 256:
              raise SystemExit(f'PASSALL did not recover 256 torus shapes: {p["capturedTorusShapes"]}')
          if p['coast']['meanAccepted'] < 40:
              raise SystemExit(f'PASSALL did not reproduce high contact multiplicity: {p["coast"]["meanAccepted"]}')
          if p['coast']['distanceMeters'] > 20 or p['coast']['endSpeed'] > 0.25:
              raise SystemExit(f'PASSALL no longer reproduces prior T65 drag: distance={p["coast"]["distanceMeters"]}, end={p["coast"]["endSpeed"]}')
          comparison={
            'PASSALL':p['coast'],
            'NEAREST1':n1['coast'],
            'NEAREST3':n3['coast'],
            'ratios':{
              'NEAREST1_distance_vs_PASSALL':n1['coast']['distanceMeters']/p['coast']['distanceMeters'],
              'NEAREST3_distance_vs_PASSALL':n3['coast']['distanceMeters']/p['coast']['distanceMeters'],
              'NEAREST1_retention_vs_PASSALL':n1['coast']['speedRetention']/p['coast']['speedRetention'] if p['coast']['speedRetention'] else None,
              'NEAREST3_retention_vs_PASSALL':n3['coast']['speedRetention']/p['coast']['speedRetention'] if p['coast']['speedRetention'] else None,
            }
          }
          print('TORUS_PRESOLVE_COMPARISON',json.dumps(comparison,separators=(',',':')))
          print('TORUS_PRESOLVE_COMPARISON_OK')
          PY
