name: JV one-shot branch cleanup

on:
  push:
    branches:
      - maintenance/branch-cleanup-once

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete archived obsolete refs
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'candidate/jv-web-owner-vehicle-visual-r1'
            'candidate/jv-web-render-host-r1'
            'checkpoint/perf-foundation-a53-validated-2026-08-15'
            'checkpoint/perf-foundation-s3-2026-08-15'
            'checkpoint/perf-interruption-recovery-2026-08-15'
            'checkpoint/perf-lowlevel-preexec-2026-08-15'
            'checkpoint/perf-lowlevel-repaired-validated-2026-08-15'
            'checkpoint/perf-lowlevel-source-candidate-2026-08-15'
            'checkpoint/perf-lowlevel-validated-runtime-hardening-2026-08-15'
            'checkpoint/perf-shadow-staged-hardening-recovery-2026-08-15'
            'checkpoint/perf-validation-session-2026-08-15'
            'checkpoint/r1-drive-bridge-01-audited'
            'noop-do-not-create'
            'noop-should-not-create'
            'noop-should-not-create-2'
            'product/jv-web-car-map-scan'
            'repair/jv-web-release-r0'
            'work/friends-pages-r1'
            'work/friends-r1-live-perf'
            'work/friends-r1-live-perf-hardening'
            'work/front-corner-golden-rebuild-r1'
            'work/front-corner-golden-rebuild-r2'
            'work/owner-rig-s1-attachment-authority'
            'work/owner-rig-s1-clean-integration'
          )

          encode_ref() {
            python3 - "$1" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          }

          for branch in "${branches[@]}"; do
            ref="heads/${branch}"
            encoded="$(encode_ref "$ref")"
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${encoded}"
          done

      - name: Remove one-shot maintenance ref
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 - <<'PY'
          from urllib.parse import quote
          print(quote('heads/maintenance/branch-cleanup-once', safe=''))
          PY
          )"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${encoded}" || true
