name: Wheel mode5 source Tire cross-section audit

on:
  push:
    branches:
      - work/wheel-mode5-d-pathology-2026-09-03
    paths:
      - .github/workflows/wheel-mode5-tire-cross-section-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Recover skinned Tire and compare cross-section
        run: node tools/wheel-mode5-tire-cross-section-audit.mjs
