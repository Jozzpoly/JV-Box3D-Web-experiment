name: JSPREV2 spawn landmark crosscheck

on:
  push:
    branches:
      - work/spawn-landmark-calibration-2026-09-05
    paths:
      - tools/spawn-analysis/jsprev2-spawn-candidate-crosscheck.mjs
      - .github/workflows/jsprev2-spawn-landmark-crosscheck.yml

permissions:
  contents: write

jobs:
  crosscheck-spawn-landmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - name: Crosscheck exact accepted JSPREV2 candidate regions
        run: |
          set -euxo pipefail
          node tools/spawn-analysis/jsprev2-spawn-candidate-crosscheck.mjs
          node -e "const fs=require('fs'); const p='docs/evidence/JSPREV2_SPAWN_LANDMARK_CROSSCHECK_2026-09-05.json'; const x=JSON.parse(fs.readFileSync(p)); if(x.source?.commit!=='a325c279cfe63a0607dba33c3c635a1716e09f8f') throw new Error('source drift'); if(x.integrity?.parsedVertices!==1409687) throw new Error('vertex count drift'); if(!['GEOMETRIC_CANDIDATE_REGIONS_CROSSCHECK_STABLE_NOT_SEMANTIC','PRIMARY_GEOMETRIC_CANDIDATES_NOT_ROBUST_ENOUGH'].includes(x.classification)) throw new Error('invalid classification');"
          git diff --check
          git diff -- docs/evidence/JSPREV2_SPAWN_LANDMARK_CROSSCHECK_2026-09-05.json

      - name: Commit independent crosscheck evidence
        run: |
          set -euxo pipefail
          test -n "$(git status --porcelain -- docs/evidence/JSPREV2_SPAWN_LANDMARK_CROSSCHECK_2026-09-05.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/JSPREV2_SPAWN_LANDMARK_CROSSCHECK_2026-09-05.json
          git commit -m "research: record JSPREV2 spawn candidate crosscheck"
          git push origin HEAD:work/spawn-landmark-calibration-2026-09-05
