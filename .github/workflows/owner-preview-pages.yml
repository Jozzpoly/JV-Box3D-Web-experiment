name: JV Owner Preview Pages

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - preview/owner.json
      - preview/owner-ab.json
      - preview/owner-spawn.json
      - .github/workflows/owner-preview-pages.yml

permissions:
  contents: read

concurrency:
  group: jv-owner-preview-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout preview control lane
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve exact accepted root and wheel A-B-C-D composition
        id: candidate
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          owner = json.loads(Path("preview/owner.json").read_text(encoding="utf-8"))
          if owner.get("schema") != "JV_OWNER_PREVIEW_POINTER_V2":
              raise SystemExit("Owner Preview must use the accepted V2 pointer")
          root_sha = str(owner.get("sourceCommit", "")).strip().lower()
          if root_sha != "529ae7d3e6d09faf2cfdd5bb034b01c693f8f9c0":
              raise SystemExit(f"accepted Owner Preview executable source drifted: {root_sha}")
          layers = owner.get("staticLayers")
          if not isinstance(layers, list) or len(layers) != 1:
              raise SystemExit("Owner Preview requires exactly one accepted static layer")
          scan = layers[0]
          if scan != {
              "role": "accepted-jsprev2",
              "repository": "Jozzpoly/JV-Box3D-Web-Public",
              "commit": "a325c279cfe63a0607dba33c3c635a1716e09f8f",
              "receipt": "receipts/jv_friends_scan_receipt.json",
          }:
              raise SystemExit(f"accepted JSPREV2 layer drifted: {scan!r}")

          wheel = json.loads(Path("preview/owner-ab.json").read_text(encoding="utf-8"))
          if wheel.get("schema") != "JV_OWNER_AB_POINTER_V1" or wheel.get("experiment") != "wheel-mode5-contact-geometry":
              raise SystemExit("Owner wheel pointer identity drifted")
          wheel_sha = str(wheel.get("sourceCommit", "")).strip().lower()
          if wheel_sha != "d52aa3776e022649af21cddc6d9dcfae3bac42f9":
              raise SystemExit(f"Owner wheel A-B-C-D source drifted: {wheel_sha}")
          expected = [
              {"id": "flat-control", "viteMode5WheelGeometry": "flat-control"},
              {"id": "asset-profile", "viteMode5WheelGeometry": "asset-profile"},
              {"id": "solver-aware-profile", "viteMode5WheelGeometry": "solver-aware-profile"},
              {"id": "core-torus64", "viteMode5WheelGeometry": "core-torus64"},
          ]
          if wheel.get("variants") != expected:
              raise SystemExit(f"Owner wheel A-B-C-D variants drifted: {wheel.get('variants')!r}")
          if re.fullmatch(r"[0-9a-f]{40}", wheel_sha) is None:
              raise SystemExit("Owner wheel source must be an exact commit")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"root_sha={root_sha}\n")
              out.write(f"scan_repository={scan['repository']}\n")
              out.write(f"scan_sha={scan['commit']}\n")
              out.write(f"scan_receipt={scan['receipt']}\n")
              out.write(f"wheel_sha={wheel_sha}\n")
          print(f"accepted root={root_sha}; wheel A-B-C-D={wheel_sha}")
          PY

      - name: Resolve exact spawn calibration composition
        id: spawn
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          spawn = json.loads(Path("preview/owner-spawn.json").read_text(encoding="utf-8"))
          if spawn.get("schema") != "JV_OWNER_SPAWN_CALIBRATION_POINTER_V1" or spawn.get("experiment") != "spawn-landmark-calibration":
              raise SystemExit("Owner spawn calibration pointer identity drifted")
          spawn_sha = str(spawn.get("sourceCommit", "")).strip().lower()
          if re.fullmatch(r"[0-9a-f]{40}", spawn_sha) is None:
              raise SystemExit("Owner spawn calibration source must be an exact commit")
          expected_layer = {
              "role": "accepted-jsprev2",
              "repository": "Jozzpoly/JV-Box3D-Web-Public",
              "commit": "a325c279cfe63a0607dba33c3c635a1716e09f8f",
              "receipt": "receipts/jv_friends_scan_receipt.json",
          }
          if spawn.get("staticLayer") != expected_layer:
              raise SystemExit(f"Owner spawn calibration static layer drifted: {spawn.get('staticLayer')!r}")
          expected_variants = [
              {"id": "scan-cal-a", "query": "jvSpawn=scan-cal-a"},
              {"id": "scan-cal-b", "query": "jvSpawn=scan-cal-b"},
              {"id": "scan-cal-c", "query": "jvSpawn=scan-cal-c"},
          ]
          if spawn.get("variants") != expected_variants:
              raise SystemExit(f"Owner spawn calibration variants drifted: {spawn.get('variants')!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"spawn_sha={spawn_sha}\n")
          print(f"spawn calibration={spawn_sha}")
          PY

      - name: Checkout exact accepted executable source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.root_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup canonical Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install and validate accepted executable
        env:
          ROOT_SHA: ${{ steps.candidate.outputs.root_sha }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$ROOT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(node --version)" = "v24.16.0"
          npm ci
          npm run typecheck
          npm run build:portable
          node tools/validate-build-identity.mjs
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("dist/build-manifest.json", "utf8"));
          if (manifest?.source?.commit !== process.env.ROOT_SHA || manifest?.source?.workingTreeClean !== true) {
            throw new Error(`accepted root manifest drift: ${JSON.stringify(manifest?.source)}`);
          }
          NODE

      - name: Fetch and verify exact accepted JSPREV2
        env:
          SCAN_REPOSITORY: ${{ steps.candidate.outputs.scan_repository }}
          SCAN_SHA: ${{ steps.candidate.outputs.scan_sha }}
          SCAN_RECEIPT: ${{ steps.candidate.outputs.scan_receipt }}
          ROOT_SHA: ${{ steps.candidate.outputs.root_sha }}
        run: |
          set -euxo pipefail
          scan_checkout="$RUNNER_TEMP/jv-owner-preview-scan"
          rm -rf "$scan_checkout"
          git clone --filter=blob:none --no-checkout "https://github.com/${SCAN_REPOSITORY}.git" "$scan_checkout"
          git -C "$scan_checkout" sparse-checkout init --cone
          git -C "$scan_checkout" sparse-checkout set __jv_scan__ receipts
          git -C "$scan_checkout" checkout --detach "$SCAN_SHA"
          test "$(git -C "$scan_checkout" rev-parse HEAD)" = "$SCAN_SHA"
          test ! -e dist/__jv_scan__
          mkdir -p dist/receipts
          cp -a "$scan_checkout/__jv_scan__" dist/__jv_scan__
          cp "$scan_checkout/$SCAN_RECEIPT" "dist/$SCAN_RECEIPT"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dist = Path("dist")
          receipt_path = Path(os.environ["SCAN_RECEIPT"])
          receipt = json.loads((dist / receipt_path).read_text(encoding="utf-8"))
          if receipt.get("schema") != "JV_WEB_FRIENDS_SCAN_RELEASE_V1" or receipt.get("schemaVersion") != 1 or receipt.get("releaseId") != "friends-r1" or receipt.get("publicationClass") != "FRIENDS_PUBLIC_INPUT" or receipt.get("sourceMetadataPreserved") is not True:
              raise SystemExit("accepted JSPREV2 receipt identity drifted")
          records = receipt.get("files")
          if not isinstance(records, list) or len(records) != 33:
              raise SystemExit("accepted JSPREV2 must contain exactly 33 recorded files")
          total = 0
          for record in records:
              path = dist / record["path"]
              if not path.is_file() or path.stat().st_size != record["bytes"]:
                  raise SystemExit(f"accepted JSPREV2 byte mismatch: {record['path']}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit(f"accepted JSPREV2 hash mismatch: {record['path']}")
              total += path.stat().st_size
          index = json.loads((dist / "__jv_scan__/index.json").read_text(encoding="utf-8"))
          if index.get("schema") != "JV_WEB_JSPREV2_INDEX_V2" or index.get("available") is not True or index.get("packId") != "scan/photogrammetry-primary":
              raise SystemExit("accepted JSPREV2 runtime index drifted")
          composition = {
              "schema": "JV_OWNER_PREVIEW_COMPOSITION_V1",
              "executableSource": {
                  "repository": "Jozzpoly/JV-Box3D-Web-experiment",
                  "commit": os.environ["ROOT_SHA"],
                  "manifest": "build-manifest.json",
              },
              "staticLayers": [{
                  "role": "accepted-jsprev2",
                  "repository": os.environ["SCAN_REPOSITORY"],
                  "commit": os.environ["SCAN_SHA"],
                  "receipt": os.environ["SCAN_RECEIPT"],
                  "previewContentSha256": receipt["source"]["previewContentSha256"],
                  "runtimeFiles": len(records),
                  "runtimeBytes": total,
              }],
          }
          (dist / "owner-preview-composition.json").write_text(json.dumps(composition, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Snapshot accepted root before experiments
        run: |
          set -euxo pipefail
          root_snapshot="$RUNNER_TEMP/jv-owner-accepted-root"
          rm -rf "$root_snapshot"
          mkdir -p "$root_snapshot"
          cp -a dist/. "$root_snapshot/"
          (cd "$root_snapshot" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/jv-owner-accepted-root.sha256"

      - name: Checkout exact same-source wheel A-B-C-D candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.wheel_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build four portable wheel variants from the exact same source
        env:
          WHEEL_SHA: ${{ steps.candidate.outputs.wheel_sha }}
          SCAN_RECEIPT: ${{ steps.candidate.outputs.scan_receipt }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$WHEEL_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          npm ci
          npm run typecheck
          scan_checkout="$RUNNER_TEMP/jv-owner-preview-scan"
          for spec in \
            'flat:flat-control' \
            'profile:asset-profile' \
            'solver:solver-aware-profile' \
            'torus:core-torus64'
          do
            path="${spec%%:*}"
            variant="${spec#*:}"
            rm -rf dist
            VITE_JV_MODE5_WHEEL_GEOMETRY="$variant" npm run build:portable
            node tools/validate-build-identity.mjs
            VARIANT="$variant" python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("dist/build-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("source", {}).get("commit") != os.environ["WHEEL_SHA"] or manifest.get("source", {}).get("workingTreeClean") is not True:
              raise SystemExit(f"wheel variant source drift: {manifest.get('source')!r}")
          Path("dist/owner-ab-variant.json").write_text(json.dumps({
              "schema": "JV_OWNER_AB_VARIANT_V1",
              "experiment": "wheel-mode5-contact-geometry",
              "sourceCommit": os.environ["WHEEL_SHA"],
              "variant": os.environ["VARIANT"],
              "buildManifest": "build-manifest.json",
          }, indent=2) + "\n", encoding="utf-8")
          PY
            if [ "$variant" = "core-torus64" ]; then
              grep -Rqs 'native_m6_mode5_core_torus64' dist
              grep -Rqs 'core-torus64-parity' dist
            fi
            mkdir -p dist/receipts
            cp -a "$scan_checkout/__jv_scan__" dist/__jv_scan__
            cp "$scan_checkout/$SCAN_RECEIPT" "dist/$SCAN_RECEIPT"
            target="$RUNNER_TEMP/jv-wheel-$path"
            rm -rf "$target"
            mkdir -p "$target"
            cp -a dist/. "$target/"
          done

      - name: Prove four executable cores are pairwise distinct
        env:
          WHEEL_SHA: ${{ steps.candidate.outputs.wheel_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          roots = {
              "flat": (Path(os.environ["RUNNER_TEMP"]) / "jv-wheel-flat", "flat-control"),
              "profile": (Path(os.environ["RUNNER_TEMP"]) / "jv-wheel-profile", "asset-profile"),
              "solver": (Path(os.environ["RUNNER_TEMP"]) / "jv-wheel-solver", "solver-aware-profile"),
              "torus": (Path(os.environ["RUNNER_TEMP"]) / "jv-wheel-torus", "core-torus64"),
          }
          digests = {}
          for name, (root, expected_variant) in roots.items():
              marker = json.loads((root / "owner-ab-variant.json").read_text(encoding="utf-8"))
              manifest = json.loads((root / "build-manifest.json").read_text(encoding="utf-8"))
              if marker.get("sourceCommit") != os.environ["WHEEL_SHA"] or marker.get("variant") != expected_variant:
                  raise SystemExit(f"{name} marker drift")
              if manifest.get("source", {}).get("commit") != os.environ["WHEEL_SHA"]:
                  raise SystemExit(f"{name} manifest source drift")
              digest = hashlib.sha256()
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  rel = path.relative_to(root).as_posix()
                  if rel in {"build-manifest.json", "owner-ab-variant.json"} or rel.startswith(("__jv_scan__/", "receipts/")):
                      continue
                  digest.update(rel.encode())
                  digest.update(b"\0")
                  digest.update(hashlib.sha256(path.read_bytes()).digest())
              digests[name] = digest.hexdigest()
          if len(set(digests.values())) != 4:
              raise SystemExit(f"A-B-C-D executable cores are not pairwise distinct: {digests!r}")
          print("OWNER_WHEEL_ABCD_BUILD_SEPARATION_OK", os.environ["WHEEL_SHA"], digests)
          PY

      - name: Compose isolated A-B-C-D paths into the accepted root
        env:
          WHEEL_SHA: ${{ steps.candidate.outputs.wheel_sha }}
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist
          cp -a "$RUNNER_TEMP/jv-owner-accepted-root/." dist/
          root="dist/__experiments__/wheel-mode5"
          mkdir -p "$root/flat" "$root/profile" "$root/solver" "$root/torus"
          cp -a "$RUNNER_TEMP/jv-wheel-flat/." "$root/flat/"
          cp -a "$RUNNER_TEMP/jv-wheel-profile/." "$root/profile/"
          cp -a "$RUNNER_TEMP/jv-wheel-solver/." "$root/solver/"
          cp -a "$RUNNER_TEMP/jv-wheel-torus/." "$root/torus/"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("dist/__experiments__/wheel-mode5")
          (root / "index.json").write_text(json.dumps({
              "schema": "JV_OWNER_AB_INDEX_V1",
              "experiment": "wheel-mode5-contact-geometry",
              "sourceCommit": os.environ["WHEEL_SHA"],
              "sameSource": True,
              "variants": [
                  {"id": "flat-control", "path": "flat/"},
                  {"id": "asset-profile", "path": "profile/"},
                  {"id": "solver-aware-profile", "path": "solver/"},
                  {"id": "core-torus64", "path": "torus/"},
              ],
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Checkout exact spawn calibration candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.spawn.outputs.spawn_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: __spawn_candidate

      - name: Qualify and build spawn calibration candidate
        working-directory: __spawn_candidate
        env:
          SPAWN_SHA: ${{ steps.spawn.outputs.spawn_sha }}
          SCAN_RECEIPT: ${{ steps.candidate.outputs.scan_receipt }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SPAWN_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(node --version)" = "v24.16.0"
          npm ci
          npm run typecheck
          node tools/run-tests.mjs tests/product-spawn.test.mjs
          rm -rf dist
          npm run build:portable
          node tools/validate-build-identity.mjs
          SPAWN_SHA="$SPAWN_SHA" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("dist/build-manifest.json", "utf8"));
          if (manifest?.source?.commit !== process.env.SPAWN_SHA || manifest?.source?.workingTreeClean !== true) {
            throw new Error(`spawn calibration manifest drift: ${JSON.stringify(manifest?.source)}`);
          }
          NODE
          scan_checkout="$RUNNER_TEMP/jv-owner-preview-scan"
          mkdir -p dist/receipts
          cp -a "$scan_checkout/__jv_scan__" dist/__jv_scan__
          cp "$scan_checkout/$SCAN_RECEIPT" "dist/$SCAN_RECEIPT"

      - name: Compose isolated spawn calibration paths
        env:
          SPAWN_SHA: ${{ steps.spawn.outputs.spawn_sha }}
          SCAN_REPOSITORY: ${{ steps.candidate.outputs.scan_repository }}
          SCAN_SHA: ${{ steps.candidate.outputs.scan_sha }}
          SCAN_RECEIPT: ${{ steps.candidate.outputs.scan_receipt }}
        run: |
          set -euxo pipefail
          root="dist/__experiments__/spawn-calibration"
          candidate="$root/by-sha/$SPAWN_SHA"
          rm -rf "$root"
          mkdir -p "$candidate"
          cp -a "__spawn_candidate/dist/." "$candidate/"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("dist/__experiments__/spawn-calibration")
          sha = os.environ["SPAWN_SHA"]
          version_path = f"by-sha/{sha}/"
          candidate = root / "by-sha" / sha
          variants = [
              {"id": "scan-cal-a", "query": "jvSpawn=scan-cal-a", "href": f"{version_path}?jvSpawn=scan-cal-a"},
              {"id": "scan-cal-b", "query": "jvSpawn=scan-cal-b", "href": f"{version_path}?jvSpawn=scan-cal-b"},
              {"id": "scan-cal-c", "query": "jvSpawn=scan-cal-c", "href": f"{version_path}?jvSpawn=scan-cal-c"},
          ]
          marker = {
              "schema": "JV_OWNER_SPAWN_CALIBRATION_VARIANT_V1",
              "experiment": "spawn-landmark-calibration",
              "sourceCommit": sha,
              "buildManifest": "build-manifest.json",
              "staticLayer": {
                  "role": "accepted-jsprev2",
                  "repository": os.environ["SCAN_REPOSITORY"],
                  "commit": os.environ["SCAN_SHA"],
                  "receipt": os.environ["SCAN_RECEIPT"],
              },
              "variants": variants,
              "acceptedProduct": False,
          }
          (candidate / "owner-spawn-calibration.json").write_text(json.dumps(marker, indent=2) + "\n", encoding="utf-8")
          (root / "index.json").write_text(json.dumps({
              "schema": "JV_OWNER_SPAWN_CALIBRATION_INDEX_V1",
              "experiment": "spawn-landmark-calibration",
              "sourceCommit": sha,
              "candidatePath": version_path,
              "variants": variants,
              "acceptedProduct": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Prove isolated spawn calibration composition
        env:
          SPAWN_SHA: ${{ steps.spawn.outputs.spawn_sha }}
          SCAN_SHA: ${{ steps.candidate.outputs.scan_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const root = "dist/__experiments__/spawn-calibration";
          const versionPath = `by-sha/${process.env.SPAWN_SHA}/`;
          const candidate = `${root}/by-sha/${process.env.SPAWN_SHA}`;
          const expectedVariants = [
            {id:"scan-cal-a",query:"jvSpawn=scan-cal-a",href:`${versionPath}?jvSpawn=scan-cal-a`},
            {id:"scan-cal-b",query:"jvSpawn=scan-cal-b",href:`${versionPath}?jvSpawn=scan-cal-b`},
            {id:"scan-cal-c",query:"jvSpawn=scan-cal-c",href:`${versionPath}?jvSpawn=scan-cal-c`},
          ];
          const index = JSON.parse(await readFile(`${root}/index.json`, "utf8"));
          const marker = JSON.parse(await readFile(`${candidate}/owner-spawn-calibration.json`, "utf8"));
          const manifest = JSON.parse(await readFile(`${candidate}/build-manifest.json`, "utf8"));
          const scanIndex = JSON.parse(await readFile(`${candidate}/__jv_scan__/index.json`, "utf8"));
          if (index?.schema !== "JV_OWNER_SPAWN_CALIBRATION_INDEX_V1" || index?.experiment !== "spawn-landmark-calibration" || index?.sourceCommit !== process.env.SPAWN_SHA || index?.candidatePath !== versionPath || index?.acceptedProduct !== false || JSON.stringify(index?.variants) !== JSON.stringify(expectedVariants)) {
            throw new Error("spawn calibration index provenance drift");
          }
          if (marker?.schema !== "JV_OWNER_SPAWN_CALIBRATION_VARIANT_V1" || marker?.sourceCommit !== process.env.SPAWN_SHA || marker?.staticLayer?.commit !== process.env.SCAN_SHA || marker?.acceptedProduct !== false || JSON.stringify(marker?.variants) !== JSON.stringify(expectedVariants)) {
            throw new Error("spawn calibration marker provenance drift");
          }
          if (manifest?.source?.commit !== process.env.SPAWN_SHA || manifest?.source?.workingTreeClean !== true) {
            throw new Error("spawn calibration build source drift");
          }
          if (scanIndex?.schema !== "JV_WEB_JSPREV2_INDEX_V2" || scanIndex?.packId !== "scan/photogrammetry-primary" || scanIndex?.available !== true) {
            throw new Error("spawn calibration scan layer drift");
          }
          console.log(`OWNER_SPAWN_CALIBRATION_COMPOSITION_OK spawn=${process.env.SPAWN_SHA} scan=${process.env.SCAN_SHA} path=${versionPath}`);
          NODE

      - name: Prove accepted root stayed byte-identical outside experiments
        env:
          ROOT_SHA: ${{ steps.candidate.outputs.root_sha }}
          WHEEL_SHA: ${{ steps.candidate.outputs.wheel_sha }}
        run: |
          set -euxo pipefail
          (cd dist && find . -path './__experiments__' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/jv-owner-accepted-root-after.sha256"
          diff -u "$RUNNER_TEMP/jv-owner-accepted-root.sha256" "$RUNNER_TEMP/jv-owner-accepted-root-after.sha256"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const rootManifest = JSON.parse(await readFile("dist/build-manifest.json", "utf8"));
          if (rootManifest?.source?.commit !== process.env.ROOT_SHA) throw new Error("accepted root source changed");
          const index = JSON.parse(await readFile("dist/__experiments__/wheel-mode5/index.json", "utf8"));
          const expected = [
            {id:"flat-control",path:"flat/"},
            {id:"asset-profile",path:"profile/"},
            {id:"solver-aware-profile",path:"solver/"},
            {id:"core-torus64",path:"torus/"},
          ];
          if (index?.sourceCommit !== process.env.WHEEL_SHA || index?.sameSource !== true || JSON.stringify(index?.variants) !== JSON.stringify(expected)) throw new Error("A-B-C-D index provenance drift");
          for (const path of ["flat","profile","solver","torus"]) {
            const manifest = JSON.parse(await readFile(`dist/__experiments__/wheel-mode5/${path}/build-manifest.json`, "utf8"));
            if (manifest?.source?.commit !== process.env.WHEEL_SHA) throw new Error(`${path} source drift`);
          }
          console.log(`OWNER_PREVIEW_ABCD_COMPOSITION_OK root=${process.env.ROOT_SHA} wheel=${process.env.WHEEL_SHA}`);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy Owner Preview
        id: deployment
        uses: actions/deploy-pages@v5
