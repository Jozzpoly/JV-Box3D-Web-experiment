name: Wheel mode5 pre-D canonical comparator

on:
  push:
    branches:
      - work/wheel-mode5-registration-diagnostic-2026-09-02
    paths:
      - .github/workflows/wheel-mode5-pre-d-canonical-comparator.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact pre-D C source
        uses: actions/checkout@v7
        with:
          ref: 6bed3281e161a77062ffd6849aa674e55db7f758
          fetch-depth: 1
      - name: Verify exact baseline
        run: test "$(git rev-parse HEAD)" = "6bed3281e161a77062ffd6849aa674e55db7f758"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Run same canonical check on pre-D C
        shell: bash
        run: |
          set +e
          npm run check > /tmp/jv-pre-d-check.log 2>&1
          status=$?
          set -e
          CHECK_STATUS="$status" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          lines = Path('/tmp/jv-pre-d-check.log').read_text(encoding='utf-8', errors='replace').splitlines()
          print(f'PRE_D_CANONICAL_STATUS={os.environ["CHECK_STATUS"]}')
          print(f'PRE_D_CANONICAL_LINES={len(lines)}')
          print('=== PRE-D FAILURES ===')
          markers = []
          for i, line in enumerate(lines):
              if '✖' in line or 'AssertionError' in line or 'ERR_ASSERTION' in line or re.search(r'failing tests', line, re.I):
                  markers.append(i)
          emitted = set()
          for i in markers[:24]:
              start, end = max(0, i-3), min(len(lines), i+9)
              key=(start,end)
              if key in emitted:
                  continue
              emitted.add(key)
              print(f'--- lines {start+1}-{end} ---')
              for j in range(start,end):
                  print(f'{j+1:05d}: {lines[j]}')
          print('=== PRE-D TAIL ===')
          for j in range(max(0, len(lines)-100), len(lines)):
              print(f'{j+1:05d}: {lines[j]}')
          PY
          exit "$status"
