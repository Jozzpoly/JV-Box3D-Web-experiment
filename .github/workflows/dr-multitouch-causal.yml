name: JV D-R Multitouch Causal Check

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - .github/workflows/dr-multitouch-causal.yml

permissions:
  contents: read
  statuses: write

jobs:
  causal:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: 3f6acc821c9db9d4cd77845b8eb81f4625aaaef7
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" --data "{\"state\":\"pending\",\"context\":\"jv/dr-multitouch-causal\",\"description\":\"D/R pointer lifecycle validation running\",\"target_url\":\"$run_url\"}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install declared npm
        run: |
          package_manager="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
          (cd "$RUNNER_TEMP" && npm install --global "$package_manager")
          test "$(node --version)" = "v$(cat .node-version)"
          test "npm@$(npm --version)" = "$package_manager"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused D/R causal suites
        run: >-
          npm test --
          tests/dr-multitouch-acquisition.test.mjs
          tests/analog-drive.test.mjs
          tests/mobile-driving-viewport-lifecycle.test.mjs
          tests/clean-browser-host-analog-drive-contract.test.mjs
          tests/mobile-driving-integration-contract.test.mjs
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" --data "{\"state\":\"success\",\"context\":\"jv/dr-multitouch-causal\",\"description\":\"D/R pointer lifecycle focused validation PASS\",\"target_url\":\"$run_url\"}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" --data "{\"state\":\"failure\",\"context\":\"jv/dr-multitouch-causal\",\"description\":\"D/R pointer lifecycle focused validation failed\",\"target_url\":\"$run_url\"}"
