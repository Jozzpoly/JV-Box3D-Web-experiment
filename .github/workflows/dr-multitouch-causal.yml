name: JV D-R Multitouch Causal Check

on:
  push:
    branches:
      - preview/owner-control
    paths:
      - .github/workflows/dr-multitouch-causal.yml

permissions:
  contents: read
  statuses: write

jobs:
  causal:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: 9a4ed88113eea28ff14a0bc410843122c3bd6dbd
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            --data "{\"state\":\"pending\",\"context\":\"jv/dr-multitouch-causal\",\"description\":\"D/R second-pointer falsifier running\",\"target_url\":\"$run_url\"}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install declared npm
        run: |
          package_manager="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
          (cd "$RUNNER_TEMP" && npm install --global "$package_manager")
          test "$(node --version)" = "v$(cat .node-version)"
          test "npm@$(npm --version)" = "$package_manager"
      - run: npm ci
      - name: Run D/R falsifier
        run: npm test -- tests/dr-multitouch-acquisition.test.mjs
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" --data "{\"state\":\"success\",\"context\":\"jv/dr-multitouch-causal\",\"description\":\"D/R second-pointer falsifier unexpectedly PASS\",\"target_url\":\"$run_url\"}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" --data "{\"state\":\"failure\",\"context\":\"jv/dr-multitouch-causal\",\"description\":\"D/R second-pointer falsifier RED as expected\",\"target_url\":\"$run_url\"}"
