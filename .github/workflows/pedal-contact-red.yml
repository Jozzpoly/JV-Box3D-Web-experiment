name: JV pedal contact mechanics causal gate

on:
  push:
    branches:
      - preview/owner-control

permissions:
  contents: read
  statuses: write

jobs:
  pedal-contact-causal:
    runs-on: windows-latest
    steps:
      - name: Mark candidate pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '8690368aa19242bb37b9476737ee9b1f5374724a',
              state: 'pending',
              context: 'jv/pedal-contact-causal',
              description: 'Pedal contact mechanics causal gate running'
            });

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 8690368aa19242bb37b9476737ee9b1f5374724a
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up repository npm
        shell: pwsh
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run causal validation
        id: causal
        shell: pwsh
        run: |
          npm run typecheck
          npx tsc -p tsconfig.test.json
          node --test tests/analog-drive.test.mjs tests/mobile-driving-ui.test.mjs tests/mobile-driving-integration-contract.test.mjs tests/mobile-viewport-lifecycle.test.mjs tests/clean-browser-analog-drive-contract.test.mjs tests/dr-multitouch-acquisition.test.mjs
          npm run build:bundle

      - name: Record causal result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.causal.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '8690368aa19242bb37b9476737ee9b1f5374724a',
              state: outcome === 'success' ? 'success' : outcome === 'failure' ? 'failure' : 'error',
              context: 'jv/pedal-contact-causal',
              description: outcome === 'success'
                ? 'Pedal contact mechanics causal validation PASS'
                : 'Pedal contact mechanics causal validation failed'
            });
