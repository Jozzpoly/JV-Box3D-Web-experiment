name: JV pedal contact logic gate

on:
  push:
    branches:
      - preview/owner-control

permissions:
  contents: read
  statuses: write

jobs:
  pedal-contact-logic:
    runs-on: windows-latest
    steps:
      - name: Mark candidate pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'e575d01ebe7cca92df6b80ab45f8ab5328acd427',
              state: 'pending',
              context: 'jv/pedal-contact-logic',
              description: 'Pedal contact logic gate running'
            });

      - name: Checkout exact logic candidate
        uses: actions/checkout@v4
        with:
          ref: e575d01ebe7cca92df6b80ab45f8ab5328acd427
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up repository npm
        shell: pwsh
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run focused logic suites
        id: logic
        shell: pwsh
        run: |
          npm run typecheck
          npx tsc -p tsconfig.test.json
          node --test tests/analog-drive.test.mjs tests/mobile-driving-ui.test.mjs

      - name: Record logic result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.logic.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'e575d01ebe7cca92df6b80ab45f8ab5328acd427',
              state: outcome === 'success' ? 'success' : outcome === 'failure' ? 'failure' : 'error',
              context: 'jv/pedal-contact-logic',
              description: outcome === 'success'
                ? 'Pedal contact logic focused suites PASS'
                : 'Pedal contact logic focused suites failed'
            });
