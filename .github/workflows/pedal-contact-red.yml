name: JV pedal contact RED falsifier

on:
  push:
    branches:
      - preview/owner-control

permissions:
  contents: read
  statuses: write

jobs:
  pedal-contact-red:
    runs-on: windows-latest
    steps:
      - name: Mark candidate pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '6e228f103148b88c78f46a7cfc56bf2a0020c2c7',
              state: 'pending',
              context: 'jv/pedal-contact-red',
              description: 'Pedal contact-zone RED falsifier running'
            });

      - name: Checkout exact RED candidate
        uses: actions/checkout@v4
        with:
          ref: 6e228f103148b88c78f46a7cfc56bf2a0020c2c7
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up repository npm
        shell: pwsh
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run focused RED suites
        id: red
        shell: pwsh
        run: |
          npx tsc -p tsconfig.test.json
          node --test tests/analog-drive.test.mjs tests/mobile-driving-ui.test.mjs

      - name: Record RED result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.red.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '6e228f103148b88c78f46a7cfc56bf2a0020c2c7',
              state: outcome === 'failure' ? 'failure' : outcome === 'success' ? 'success' : 'error',
              context: 'jv/pedal-contact-red',
              description: outcome === 'failure'
                ? 'RED reproduced: current foundation violates new contract'
                : 'Unexpected RED result: focused suites did not fail'
            });
