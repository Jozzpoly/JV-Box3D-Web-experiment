name: JV pedal contact logic diagnostics

on:
  push:
    branches:
      - preview/owner-control

permissions:
  contents: read
  statuses: write

jobs:
  pedal-contact-diagnostics:
    runs-on: windows-latest
    steps:
      - name: Checkout exact logic candidate
        uses: actions/checkout@v4
        with:
          ref: e575d01ebe7cca92df6b80ab45f8ab5328acd427
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up repository npm
        shell: pwsh
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Compile and typecheck
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          npm run typecheck
          npx tsc -p tsconfig.test.json

      - name: Run analog mapping suite
        id: analog
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: node --test tests/analog-drive.test.mjs

      - name: Run UI state suite
        id: ui
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: node --test tests/mobile-driving-ui.test.mjs

      - name: Record diagnostic statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = 'e575d01ebe7cca92df6b80ab45f8ab5328acd427';
            const items = [
              ['jv/pedal-contact-compile', '${{ steps.compile.outcome }}'],
              ['jv/pedal-contact-analog', '${{ steps.analog.outcome }}'],
              ['jv/pedal-contact-ui', '${{ steps.ui.outcome }}']
            ];
            for (const [contextName, outcome] of items) {
              const state = outcome === 'success' ? 'success' : outcome === 'failure' ? 'failure' : 'error';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: contextName,
                description: `${contextName}: ${outcome}`
              });
            }
