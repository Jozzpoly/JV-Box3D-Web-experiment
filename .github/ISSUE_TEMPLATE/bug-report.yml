name: Bug report
description: Report a reproducible JV Web defect without posting private or security-sensitive data.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem.

        Do **not** include credentials, tokens, private keys, private asset URLs, unpublished scans/photos, personal data or local filesystem paths. Security vulnerabilities belong in the private reporting path described in `SECURITY.md`, not in a public issue.

        Driving-feel preferences and native-parity claims require an exact scenario/configuration and the correct evidence level.

  - type: input
    id: source_identity
    attributes:
      label: Exact source/build identity
      description: Provide the full 40-character commit, tag or Pages build/deployment identity.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: dropdown
    id: evidence_level
    attributes:
      label: Evidence level
      description: Select the strongest environment in which you reproduced the problem.
      options:
        - Source/static review only
        - Node 24 automated test
        - Portable static or loopback HTTP package
        - Desktop browser
        - Real phone over LAN
        - Published Pages HTTPS URL
        - Owner driving/visual observation
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/version, operating system and device. Remove account names and private paths.
      placeholder: Chrome 150, Windows 11, desktop / Android device model
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Runtime backend shown by the build
      options:
        - legacy_ts_m6 / REFERENCE_BROWSER_FIXTURE
        - native_jv_wasm
        - Unknown or not displayed
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest deterministic sequence of steps, commands or input events.
      placeholder: |
        1. Open the exact build.
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the relevant contract or expected visible behavior.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened. Quantify values when possible.
    validations:
      required: true

  - type: textarea
    id: sanitized_logs
    attributes:
      label: Sanitized logs or trace excerpt
      description: Optional. Include only the minimal excerpt after removing secrets, personal data and private/local paths.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the pull-request history map.
          required: true
        - label: I did not include credentials, private paths, personal data or unpublished/private assets.
          required: true
        - label: I understand that a green fixture test is not automatically native JV parity.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
